<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="没能陪你走到最后">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>html,body{margin:0;height:100%;background:#000;overscroll-behavior:none;-webkit-text-size-adjust:100%}[hidden]{display:none!important}</style>
<title>没能陪你走到最后</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 393×852pt phone centered on a quiet stage, scaled down only when the window is too small */
:root{
  --stage:#e9ebf0; --stage-fg:#4a4f5c; --stage-mute:#8a90a0;
  --ios-blue:#0a84ff; --ios-green:#34c759; --ios-orange:#ff9f0a; --ios-red:#ff3b30;
  --app-bg:#f2f2f7; --app-cell:#ffffff; --app-fg:#000000; --app-sub:#8e8e93; --app-sep:rgba(60,60,67,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans SC",system-ui,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#121317;--stage-fg:#c9ccd6;--stage-mute:#6c7180;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#121317;--stage-fg:#c9ccd6;--stage-mute:#6c7180;color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--stage);color:var(--stage-fg);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.fit{position:relative;flex:none}
.caption{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--stage-mute);letter-spacing:.02em}
.caption button{font:inherit;color:var(--stage-fg);background:none;border:1px solid currentColor;border-radius:999px;padding:3px 10px;cursor:pointer;opacity:.8}
.caption button:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px}

/* ---------- device ---------- */
.phone{position:absolute;left:0;top:0;width:421px;height:880px;transform-origin:0 0;
  border-radius:69px;background:linear-gradient(145deg,#4b4a48,#2a2a2a 40%,#3c3b39);padding:14px;box-sizing:border-box;
  box-shadow:0 0 0 1.5px #1b1b1b inset,0 0 0 4px #0b0b0b inset,0 30px 60px rgba(0,0,0,.28),0 8px 18px rgba(0,0,0,.18);user-select:none;-webkit-user-select:none}
.hw{position:absolute;background:linear-gradient(90deg,#2b2b2b,#555 50%,#2b2b2b);border-radius:3px;cursor:pointer;border:0;padding:0}
.hw.l{left:-3px;width:4px}.hw.r{right:-3px;width:4px}
.hw:active{filter:brightness(1.4)}
.screen{position:relative;width:var(--sw,393px);height:852px;border-radius:55px;overflow:hidden;background:#000;color:#fff;
  font-family:var(--font);-webkit-font-smoothing:antialiased;touch-action:none;isolation:isolate}
.wall{position:absolute;inset:0;background:
  radial-gradient(120% 60% at 15% 10%,#ff8a5c 0%,rgba(255,138,92,0) 55%),
  radial-gradient(90% 55% at 95% 35%,#7a5cff 0%,rgba(122,92,255,0) 60%),
  radial-gradient(120% 70% at 30% 95%,#1f6bff 0%,rgba(31,107,255,0) 60%),
  linear-gradient(170deg,#2a1d4f,#0f1638 60%,#08122a);transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s}
.screen.in-app .wall{transform:scale(1.08);filter:blur(6px) brightness(.8)}
.screen.locked .wall{filter:brightness(.92)}

/* status bar + island */
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 0;pointer-events:none;transition:color .25s}
.status .time{width:142px;text-align:center;font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,sans-serif;font-weight:600;font-size:17px;letter-spacing:-.4px;padding-top:3px}
.status .right{display:flex;gap:6px;align-items:center;padding-top:4px}
.status svg{display:block;fill:currentColor}
.screen.dark-status .status{color:#000}
.screen.locked .status .time{font-size:15px;font-weight:500}
.batt{width:27px;height:13px;border:1.2px solid currentColor;border-radius:4.3px;opacity:.95;position:relative;box-sizing:border-box;padding:1.5px}
.batt::after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:4px;border-radius:0 1px 1px 0;background:currentColor;opacity:.5}
.batt i{display:block;height:100%;width:80%;background:currentColor;border-radius:2px}
.island{position:absolute;left:50%;top:11px;width:125px;height:37px;margin-left:-62.5px;background:#000;border-radius:20px;z-index:70;
  transition:all .45s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;overflow:hidden;cursor:pointer}
.island .il,.island .ir{opacity:0;transition:opacity .2s;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.island.big{width:360px;margin-left:-180px;height:84px;border-radius:42px;top:9px;padding:0 22px}
.island.big .il,.island.big .ir{opacity:1;transition-delay:.15s}
.island.pill{width:200px;margin-left:-100px}
.island.pill .il,.island.pill .ir{opacity:1;transition-delay:.12s}

/* layers */
.layer{position:absolute;inset:0}
.home{z-index:10;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .45s}
.screen.locked .home{transform:scale(1.12);opacity:0;pointer-events:none}
.screen.in-app .home{transform:scale(.9);opacity:.0;pointer-events:none}
.pages{position:absolute;left:0;top:0;height:100%;display:flex;width:calc(var(--sw,393px) * 2);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.page{width:var(--sw,393px);height:100%;box-sizing:border-box;padding:70px 25px 0}
.grid{display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;grid-auto-rows:86px;row-gap:22px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app .lbl{font-size:12px;line-height:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap;letter-spacing:-.1px}
.icon{width:62px;height:62px;border-radius:14.5px;position:relative;overflow:hidden;flex:none;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.icon svg{position:absolute;inset:0;width:100%;height:100%}
.app:active .icon{transform:scale(.92);filter:brightness(.8)}
.badge{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:#ff3b30;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 6px;box-sizing:border-box;z-index:2}
.iconwrap{position:relative}
.badge[hidden]{display:none}
.jiggle .iconwrap{animation:jig .28s infinite alternate ease-in-out}
.jiggle .app:nth-child(2n) .iconwrap{animation-delay:-.14s;animation-direction:alternate-reverse}
@keyframes jig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.jiggle .app:active .icon{transform:none;filter:none}
.widget{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;align-items:center;gap:6px}
.wbox{width:100%;height:164px;border-radius:22px;box-sizing:border-box;padding:14px 15px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.w-weather{background:linear-gradient(180deg,#3c8ce7,#5aa9f5)}
.w-weather .city{font-size:15px;font-weight:600;display:flex;align-items:center;gap:3px}
.w-weather .deg{font-size:44px;font-weight:300;line-height:1;margin-top:2px;letter-spacing:-1px}
.w-weather .sub{position:absolute;left:15px;bottom:13px;font-size:12.5px;font-weight:600;line-height:1.3}
.w-weather .sub span{display:block;font-weight:500;opacity:.9}
.w-cal{background:#fff;color:#000}
.w-cal .wd{color:#ff3b30;font-size:12px;font-weight:700;letter-spacing:.04em}
.w-cal .dn{font-size:40px;font-weight:300;line-height:1;margin-top:1px;letter-spacing:-1px}
.w-cal .ev{margin-top:10px;border-left:3px solid #ff9500;padding-left:7px;font-size:12px;line-height:1.3}
.w-cal .ev b{font-weight:600;display:block}.w-cal .ev span{color:#8e8e93}
.w-cal .ev+.ev{border-color:#30b0c7;margin-top:6px}
.dots{position:absolute;left:0;right:0;bottom:122px;display:flex;justify-content:center;gap:7px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .2s}
.dots i.on{background:#fff}
.search{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;font-weight:500;display:flex;align-items:center;gap:5px;z-index:2;cursor:pointer}
.home.jiggle .search,.home.paging .search{display:none}.home:not(.jiggle):not(.paging) .dots{display:none}
.dots{cursor:pointer}
.donebtn{position:absolute;right:20px;top:58px;z-index:3;background:rgba(255,255,255,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border:0;border-radius:14px;padding:5px 14px;font:600 14px var(--font);cursor:pointer;display:none}
.home.jiggle .donebtn{display:block}
.dock{position:absolute;left:12px;right:12px;bottom:12px;height:92px;border-radius:36px;background:rgba(255,255,255,.22);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  display:grid;grid-template-columns:repeat(4,62px);justify-content:space-between;align-items:center;padding:0 16px;box-sizing:border-box;z-index:2}
.dock .lbl{display:none}

/* lock screen */
.lock{z-index:40;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;display:flex;flex-direction:column;align-items:center}
.screen:not(.locked) .lock{transform:translateY(-100%);pointer-events:none}
.lock .lk{margin-top:62px;opacity:.9}
.lock .date{margin-top:6px;font-size:21px;font-weight:600;opacity:.92;letter-spacing:.02em}
.lock .bigtime{font-family:var(--font-num);font-size:104px;line-height:.95;font-weight:700;letter-spacing:-3px;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.8));-webkit-background-clip:text;background-clip:text;color:transparent}
.lock .notif{margin-top:auto;margin-bottom:150px;width:361px;border-radius:22px;background:rgba(255,255,255,.28);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);padding:12px 14px;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start}
.lock .notif .icon{width:38px;height:38px;border-radius:9px}
.lock .notif .t{flex:1;font-size:14.5px;line-height:1.3}
.lock .notif .t b{font-weight:600;display:flex;justify-content:space-between}
.lock .notif .t b span{font-weight:400;opacity:.65;font-size:13px}
.qbtn{position:absolute;bottom:48px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,background .2s}
.qbtn:active{transform:scale(1.2)}.qbtn.on{background:#fff;color:#000}
.qbtn.on svg{fill:#000}
.qbtn svg{fill:#fff}
.qbtn.fl{left:46px}.qbtn.cam{right:46px}
.hint{position:absolute;bottom:42px;font-size:13px;opacity:.0;transition:opacity .3s}
.screen.locked .hint.show{opacity:.7}

/* app container */
.appwin{position:absolute;left:0;top:0;width:var(--sw,393px);height:852px;z-index:30;overflow:hidden;transform-origin:0 0;border-radius:55px;
  background:var(--app-bg);color:var(--app-fg);display:none}
.appwin.anim{transition:transform .48s cubic-bezier(.25,.9,.25,1),border-radius .48s,opacity .3s}
.appwin .cover{position:absolute;inset:0;z-index:5;transition:opacity .25s .12s;pointer-events:none}
.appwin.open .cover{opacity:0}
.appbody{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.appbody::-webkit-scrollbar{display:none}
.screen.dark .appwin{--app-bg:#000;--app-cell:#1c1c1e;--app-fg:#fff;--app-sub:#8e8e93;--app-sep:rgba(84,84,88,.6)}

/* iOS list styles */
.navtitle{font-size:34px;font-weight:700;letter-spacing:.3px;padding:96px 20px 8px}
.sbar{margin:0 16px 18px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--app-sub);font-size:17px}
.group{margin:0 16px 30px;background:var(--app-cell);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:44px;font-size:17px;position:relative;cursor:pointer}
.row:active{background:rgba(120,120,128,.16)}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:59px;height:.5px;background:var(--app-sep)}
.row .ri{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.row .ri svg{width:19px;height:19px;fill:#fff}
.row .rt{flex:1}
.row .rv{color:var(--app-sub);font-size:17px}
.row .chev{width:8px;height:14px;fill:none;stroke:#c4c4c7;stroke-width:2}
.profile{min-height:78px}
.profile .av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#a2a8b8,#6c7387);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#fff;flex:none}
.profile .rt b{display:block;font-size:20px;font-weight:500}
.profile .rt span{font-size:13px;color:var(--app-fg)}
.profile+.row::before{left:16px!important}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.16);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s}
.sw.on{background:var(--ios-green)}.sw.on::after{transform:translateX(20px)}

/* calculator */
.calc{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 17px 46px}
.calc .disp{text-align:right;font-family:var(--font-num);font-weight:300;font-size:88px;line-height:1;padding:0 8px 14px;white-space:nowrap;letter-spacing:-2px;font-variant-numeric:tabular-nums;overflow:hidden}
.calc .keys{display:grid;grid-template-columns:repeat(4,80px);gap:13px;justify-content:space-between}
.calc button{height:80px;border-radius:40px;border:0;font:400 34px var(--font-num);color:#fff;background:#333;cursor:pointer;transition:background .25s}
.calc button:active{background:#737373;transition:none}
.calc .fn{background:#a5a5a5;color:#000;font-size:30px;font-weight:500}.calc .fn:active{background:#d9d9d9}
.calc .op{background:#ff9f0a;font-size:40px}.calc .op:active{background:#fcc78d}
.calc .op.sel{background:#fff;color:#ff9f0a}
.calc .zero{grid-column:span 2;text-align:left;padding-left:31px}

/* clock */
.clock{position:absolute;inset:0;background:#000;color:#fff}
.clock .edit{position:absolute;top:58px;left:20px;right:20px;display:flex;justify-content:space-between;color:#ff9f0a;font-size:17px}
.clock .navtitle{color:#fff}
.wc{display:flex;justify-content:space-between;align-items:center;margin:0 20px;padding:14px 0;border-bottom:.5px solid rgba(84,84,88,.6)}
.wc .c small{display:block;color:#8e8e93;font-size:14px}
.wc .c b{font-size:24px;font-weight:400}
.wc .t{font-family:var(--font-num);font-size:52px;font-weight:200;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;display:flex;justify-content:space-around;padding-top:7px;box-sizing:border-box;background:rgba(22,22,22,.9);border-top:.5px solid rgba(84,84,88,.6);font-size:10px;color:#8e8e93}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar div.on{color:#ff9f0a}
.tabbar svg{width:26px;height:26px;fill:currentColor}

/* notes */
.note-row{padding:11px 16px;position:relative}
.note-row+.note-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--app-sep)}
.note-row b{display:block;font-size:17px;font-weight:600}
.note-row span{font-size:15px;color:var(--app-sub)}
.notes-foot{position:sticky;bottom:0;height:83px;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 20px;box-sizing:border-box;font-size:12px;color:var(--app-fg);background:var(--app-bg)}

/* placeholder app */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--app-sub);font-size:15px}
.ph .icon{width:96px;height:96px;border-radius:22px}
.ph b{color:var(--app-fg);font-size:22px;font-weight:600}

/* control center */
.cc{z-index:55;background:rgba(0,0,0,.25);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);opacity:0;pointer-events:none;transition:opacity .3s}
.cc.open{opacity:1;pointer-events:auto}
.cc .inner{position:absolute;left:0;right:0;top:0;padding:110px 30px 0;display:grid;grid-template-columns:repeat(4,70px);grid-auto-rows:70px;gap:16px;justify-content:space-between;
  transform:scale(.9) translateY(-30px);transform-origin:top right;transition:transform .4s cubic-bezier(.2,.9,.3,1.1)}
.cc.open .inner{transform:none}
.tile{border-radius:22px;background:rgba(120,120,128,.38);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.tile.big{grid-column:span 2;grid-row:span 2;display:grid;grid-template-columns:1fr 1fr;padding:14px;gap:10px;cursor:default;border-radius:26px}
.cbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:auto;transition:background .2s}
.cbtn svg,.tile svg{fill:#fff;width:26px;height:26px}
.cbtn.on.blue{background:var(--ios-blue)}.cbtn.on.orange{background:var(--ios-orange)}.cbtn.on.green{background:var(--ios-green)}
.tile.on{background:#fff}.tile.on svg{fill:#000}
.tile.music{grid-column:span 2;grid-row:span 2;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;cursor:default;font-size:14px;border-radius:26px}
.tile.music .ctr{display:flex;gap:24px;align-self:center;align-items:center}
.tile.music .ctr svg{cursor:pointer}
.slider{grid-row:span 2;border-radius:26px;background:rgba(120,120,128,.38);position:relative;overflow:hidden;cursor:ns-resize;touch-action:none}
.slider .fill{position:absolute;left:0;right:0;bottom:0;background:#fff}
.slider svg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:28px;height:28px;fill:#8a8a8e;z-index:1}

/* home indicator & off */
.hbar{position:absolute;left:50%;width:200px;margin-left:-100px;bottom:0;height:22px;z-index:90;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;box-sizing:border-box;cursor:grab;touch-action:none}
.hbar i{width:139px;height:5px;border-radius:3px;background:#fff;transition:background .25s}
.screen.dark-status .hbar i{background:#000}
.off{position:absolute;inset:0;background:#000;z-index:200;opacity:0;pointer-events:none;transition:opacity .35s}
.screen.sleeping .off{opacity:1;pointer-events:auto;cursor:pointer}
.hud{position:absolute;left:12px;top:180px;width:10px;height:150px;border-radius:6px;background:rgba(255,255,255,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:95;overflow:hidden;opacity:0;transition:opacity .3s,width .2s}
.hud.show{opacity:1;width:44px;border-radius:14px}
.hud i{position:absolute;left:0;right:0;bottom:0;background:#fff;transition:height .15s}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:rgba(40,40,40,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;z-index:96;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* wallpapers: lock screen / home screen */
.wall.wl{background:url(assets/wall_lock.jpg) center/cover #000}
.wall.wh{background:url(assets/wall_home.jpg) center/cover #000}
.wall.wl,.wall.wh{transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1),filter .45s}
.screen.locked .wall.wh{opacity:0}

/* 手机上全屏显示 */

body.mobile .appwin{border-radius:0!important}
body.mobile{margin:0;height:100dvh}body.mobile .stage{height:100dvh}

/* 手机模式：高度跟随玩家屏幕；底部横条往上挪，避开真手机的上滑手势区，并可直接点按 */

/* 全屏 App：小手机的横条放到系统横条上方，避免两条重叠 */
body.standalone .hbar{display:none}

/* 屏幕较矮时（浏览器里打开）压缩主屏幕和正在播放的间距 */
/* 手机上用真手机自己的状态栏和灵动岛，不再画假的（否则会出现两条状态栏） */
body.mobile .status,body.mobile .island{display:none}

/* =========================================================
   主屏幕：按 iPhone 17 Pro Max 截图量出的尺寸（440 宽），其他宽度按比例 --k 缩放
   图标 67 · 列距 101 · 行距 108.6 · 左右边距 35 · 第一行距顶 94 · Dock 高 114
   ========================================================= */
:root{--k:.8932}
.page{padding:calc(94px * var(--k)) calc(35px * var(--k)) 0}
.grid{grid-template-columns:repeat(4,calc(67px * var(--k)));grid-auto-rows:calc(88px * var(--k));row-gap:calc(20.6px * var(--k))}
.app{gap:calc(6px * var(--k))}
.app .lbl{font-size:12px;line-height:15px;font-weight:500;letter-spacing:0;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.icon{width:calc(67px * var(--k));height:calc(67px * var(--k));border-radius:calc(16px * var(--k))}
.badge{right:calc(-7px * var(--k));top:calc(-7px * var(--k));min-width:calc(26px * var(--k));height:calc(26px * var(--k));border-radius:13px;font-size:calc(15px * var(--k))}
.widget{gap:calc(6px * var(--k))}
.widget .wbox{width:calc(100% + 6px * var(--k));margin:0 calc(-3px * var(--k));height:calc(175px * var(--k));border-radius:calc(26px * var(--k));padding:calc(16px * var(--k)) calc(18px * var(--k))}
.w-weather{background:linear-gradient(180deg,#3d7fb3,#5c9cc8)}
.w-weather .city{font-size:calc(17px * var(--k));font-weight:600;line-height:1.25}
.w-weather .deg{font-size:calc(42px * var(--k));font-weight:400;line-height:1.15;letter-spacing:-.5px}
.w-weather .sub{left:calc(18px * var(--k));bottom:calc(16px * var(--k));font-size:calc(14px * var(--k));line-height:1.3}
.w-weather .sub svg{width:calc(20px * var(--k));height:calc(20px * var(--k))}
.w-cal .wd{font-size:calc(13px * var(--k))}
.w-cal .dn{font-size:calc(34px * var(--k));line-height:1.15}
.w-cal .ev{font-size:calc(13px * var(--k));margin-top:calc(8px * var(--k))}
.search{bottom:calc(163px * var(--k));height:calc(30px * var(--k));padding:0 calc(14px * var(--k));border-radius:calc(15px * var(--k));font-size:calc(15px * var(--k));font-weight:600}
.dots{bottom:calc(172px * var(--k))}
.dock{left:calc(18px * var(--k));right:calc(18px * var(--k));bottom:calc(20px * var(--k));height:calc(114px * var(--k));border-radius:calc(42px * var(--k));
  grid-template-columns:repeat(4,calc(67px * var(--k)));padding:0 calc(24px * var(--k))}
/* 屏幕较矮（浏览器里打开）：压缩行距 */
body.short .page{padding-top:calc(64px * var(--k))}
body.short .grid{row-gap:calc(6px * var(--k))}
body.short .widget .wbox{height:calc(160px * var(--k))}

/* =========================================================
   锁屏：按 17 Pro Max 真机截图量的尺寸（440 宽，其他宽度按 --k 缩放）
   ========================================================= */
body .lock .lk{position:absolute;top:calc(22px * var(--k));margin:0}
body .lock .date{position:absolute;left:0;right:0;top:calc(64px * var(--k));margin:0;text-align:center;font-size:calc(21px * var(--k));font-weight:700;letter-spacing:0;opacity:.95}
body .lock .bigtime{position:absolute;left:0;right:0;top:calc(92px * var(--k));text-align:center;font-size:calc(112px * var(--k));line-height:1;font-weight:700;letter-spacing:calc(-2px * var(--k));transform:none}
body .lock .notifs{width:auto;align-self:stretch;margin:auto calc(14px * var(--k)) calc(146px * var(--k));gap:calc(10px * var(--k))}
body .lock .notifs .notif{width:auto;min-height:calc(65px * var(--k));border-radius:calc(24px * var(--k));padding:calc(12px * var(--k)) calc(15px * var(--k)) calc(12px * var(--k)) calc(13px * var(--k));gap:calc(13px * var(--k));align-items:center;box-sizing:border-box;background:rgba(255,255,255,.24)}
body .lock .notifs .notif .icon{width:calc(38px * var(--k));height:calc(38px * var(--k));border-radius:calc(9px * var(--k))}
body .lock .notifs .notif .t{font-size:calc(15px * var(--k));line-height:1.3}
body .lock .notifs .notif .t b{font-size:calc(15px * var(--k));font-weight:700}
body .lock .notifs .notif .t b span{font-size:calc(14px * var(--k));font-weight:400;opacity:.7}
body .qbtn{width:calc(57px * var(--k));height:calc(57px * var(--k));bottom:calc(58px * var(--k));background:rgba(30,30,30,.45)}
body .qbtn svg{transform:scale(calc(1.1 * var(--k)))}
body .qbtn.fl{left:calc(54px * var(--k))}body .qbtn.cam{right:calc(55px * var(--k))}

/* =========================================================
   APP STYLES — iOS 字号体系（pt = px，393 宽母版）
   Large Title 34 · Title2 22 · Title3 20 · Headline/Body 17 · Callout 16
   Subhead 15 · Footnote 13 · Caption1 12 · Caption2 11
   ========================================================= */
:root{
  --fs-lt:34px; --fs-t2:22px; --fs-t3:20px; --fs-body:17px; --fs-call:16px; --fs-sub:15px; --fs-foot:13px; --fs-cap:12px; --fs-cap2:11px;
}
/* ---------- system pieces ---------- */

.lock .nc-h{display:none}
.screen.nc .lock{background:rgba(0,0,0,.28);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);z-index:56}

.appbody{overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--app-bg);color:var(--app-fg);transition:transform .4s cubic-bezier(.3,.9,.3,1),filter .4s;will-change:transform;font-size:var(--fs-body)}

.nbl{display:flex;align-items:center;gap:5px;padding-left:9px;font-size:var(--fs-body);cursor:pointer;white-space:nowrap;overflow:hidden;min-height:44px}

.sbar{margin:0 16px 16px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--app-sub);font-size:var(--fs-body)}
.ghdr{padding:0 36px 7px;font-size:var(--fs-foot);color:var(--app-sub);text-transform:uppercase}

.tb-bar{flex:none;height:83px;padding:12px 22px 0;box-sizing:border-box;display:flex;justify-content:space-between;align-items:flex-start;font-size:var(--fs-body);background:color-mix(in srgb,var(--app-bg) 92%,transparent);border-top:.5px solid var(--app-sep)}

/* ---------- Photos ---------- */
.photos .ph-hdr{position:absolute;left:0;right:0;top:0;padding:54px 16px 18px;display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(rgba(0,0,0,.45),transparent);color:#fff;z-index:4;pointer-events:none}

.photos .ph-hdr span{display:flex;gap:8px;pointer-events:auto}
.ph-lib{padding-top:2px}
.ph-g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:2px}

.ph-mem small{position:absolute;left:16px;bottom:12px;color:#fff;font-size:var(--fs-foot);opacity:.9}
.al-row{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;padding:0 16px 22px;scrollbar-width:none;touch-action:pan-x pan-y}

.al-row b{display:block;font-size:var(--fs-sub);font-weight:400;margin-top:6px;line-height:19px}.al-row small{color:var(--app-sub);font-size:var(--fs-sub)}

.pd-img{width:var(--sw,393px);height:var(--sw,393px);margin-top:60px;position:relative}

/* ---------- Camera ---------- */
.cam .vs{display:flex;flex-direction:column;background:#000}
.cam-top{display:flex;justify-content:space-between;padding:58px 24px 10px;color:#fff;font-size:var(--fs-t3)}

.cam-zoom{display:flex;justify-content:center;gap:10px;margin-top:-50px;position:relative}

/* ---------- Calendar ---------- */
.cal-wd{flex:none;display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:var(--fs-cap2);color:var(--app-sub);padding:2px 0 6px;border-bottom:.5px solid var(--app-sep);background:var(--app-bg)}

.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}

  const d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  $('#sbTime').textContent = state.locked ? '中国移动' : `${h}:${m}`;
  $('#lkTime').textContent = `${h}:${m}`;
  $('#lkDate').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${WD[d.getDay()]}`;
  $('#wCalWd').textContent = WD[d.getDay()]; $('#wCalDn').textContent = d.getDate();
  document.querySelectorAll('.cwd').forEach(t => t.textContent = WD[d.getDay()]);
  document.querySelectorAll('.cdn').forEach(t => t.textContent = d.getDate());
  const s = d.getSeconds(), mm = d.getMinutes() + s/60, hh = (h%12) + mm/60;
  document.querySelectorAll('.hh').forEach(l => l.setAttribute('transform',`rotate(${hh*30} 30 30)`));
  document.querySelectorAll('.mh').forEach(l => l.setAttribute('transform',`rotate(${mm*6} 30 30)`));
  document.querySelectorAll('.sh').forEach(l => l.setAttribute('transform',`rotate(${s*6} 30 30)`));
  document.querySelectorAll('[data-tz]').forEach(el => {
    try { el.textContent = new Intl.DateTimeFormat('zh-CN',{timeZone:el.dataset.tz,hour:'numeric',minute:'2-digit',hour12:false}).format(d); } catch(e){}
  });
}
tick(); setInterval(tick, 1000);

/* ---------- helpers ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1600); }
function islandFlash(cls, l, r, ms=1800){
  const il = $('#island'); $('#ilL').innerHTML = l; $('#ilR').innerHTML = r;
  il.className = 'island ' + cls; clearTimeout(il._t); il._t = setTimeout(()=> il.className = 'island', ms);
}
function localPt(e){ const r = screen.getBoundingClientRect(), s = r.width / W; return { x:(e.clientX - r.left)/s, y:(e.clientY - r.top)/s, s }; }
function syncStatus(){
  $('#sbPlane').style.display = state.airplane ? '' : 'none';
  $('#sbSignal').style.display = state.airplane ? 'none' : '';
  $('#sbWifi').style.display = state.wifi ? '' : 'none';
  document.querySelectorAll('#cc [data-t]').forEach(b => {
    const k = b.dataset.t; if (k in state) b.classList.toggle('on', !!state[k]);
  });
  const tv = state.app && topView(), tone = tv ? tv.dataset.tone : 'dark';
  const darkStatus = state.app && !state.cc && (tone === 'light' || (tone === 'auto' && !state.dark));
  screen.classList.toggle('dark-status', !!darkStatus);
  screen.classList.toggle('dark', state.dark);
}

/* 锁屏和主屏幕壁纸见 shell.css 的 .wl / .wh */

/* ---------- lock / unlock ---------- */
function unlock(){
  if (!state.locked) return;
  const wasNC = state.nc; state.nc = false;
  state.locked = false; screen.classList.remove('locked', 'nc'); tick();
  if (wasNC) return;
  islandFlash('pill','<svg width="18" height="18" viewBox="0 0 16 22" fill="#fff"><path d="M8 1a5 5 0 0 0-5 5v1h2V6a3 3 0 0 1 6 0v3H2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5z"/></svg>','',900);
}
function openNC(){ if (state.locked) return; state.nc = true; state.locked = true; screen.classList.add('locked', 'nc'); tick(); }
function lock(){
  state.nc = false; screen.classList.remove('nc');
  closeCC(); if (state.app) closeApp(true);
  state.locked = true; screen.classList.add('locked'); exitJiggle(); tick();
}
function sleep(){ lock(); screen.classList.add('sleeping'); }
function wake(){ screen.classList.remove('sleeping'); const h=$('#hint'); h.classList.add('show'); setTimeout(()=>h.classList.remove('show'),2500); }

/* ---------- open / close app ---------- */
let openFrom = null;
function openApp(id, fromEl){
  if (state.jiggle || state.app) return;
  closeCC();
  const r = screen.getBoundingClientRect(), s = r.width / W;
  const ir = fromEl ? fromEl.getBoundingClientRect() : { left:r.left+W*s/2-31*s, top:r.top+H*s/2-31*s, width:62*s, height:62*s };
  openFrom = { x:(ir.left-r.left)/s, y:(ir.top-r.top)/s, w:ir.width/s, h:ir.height/s };
  state.app = id;
  buildApp(id);
  const cover = $('#appcover'); cover.style.background = ART[id] ? ART[id].bg : '#000'; cover.innerHTML = '';
  appwin.className = 'appwin'; appwin.style.display = 'block';
  appwin.style.transform = `translate(${openFrom.x}px,${openFrom.y}px) scale(${openFrom.w/W},${openFrom.h/H})`;
  appwin.style.borderRadius = '120px 120px 120px 120px / 55px 55px 55px 55px';
  appwin.offsetWidth;
  appwin.className = 'appwin anim open';
  appwin.style.transform = 'none'; appwin.style.borderRadius = '55px';
  screen.classList.add('in-app');
  syncStatus();
}
function closeApp(instant){
  if (!state.app) return;
  const f = openFrom || { x:W/2-31, y:H/2-31, w:62, h:62 };
  const done = () => { appwin.style.display = 'none'; appbody.innerHTML = ''; };
  state.app = null; screen.classList.remove('in-app'); syncStatus();
  if (instant){ done(); return; }
  appwin.className = 'appwin anim';
  appwin.style.transform = `translate(${f.x}px,${f.y}px) scale(${f.w/W},${f.h/H})`;
  appwin.style.borderRadius = '120px 120px 120px 120px / 55px 55px 55px 55px';
  setTimeout(() => { if (!state.app) done(); }, 480);
}

  calday: ds => { const es = CAL.filter(e => e[0] === ds); const d0 = new Date(ds + 'T12:00:00');
    const week = Array.from({ length:7 }, (_, i) => { const d = new Date(d0); d.setDate(d0.getDate() - d0.getDay() + i); return d.toISOString().slice(0, 10); });
    const allDay = es.filter(e => !/^\d/.test(e[2])), timed = es.filter(e => /^\d/.test(e[2]));
    return { tone:'auto', cls:'cal', top:nb('', { back:`${+ds.slice(5, 7)}月`, tint:'#ff3b30' }) + `<div class="cal-wk">${week.map(d => `<span class="${d === ds ? 'sel' : ''} ${d === TODAY ? 'today' : ''}"><small>${'日一二三四五六'[new Date(d + 'T12:00:00').getDay()]}</small><b>${+d.slice(8)}</b></span>`).join('')}</div><div class="cal-dh">${ymd(ds)} ${wk(ds)}</div>`,

/* ---------- Spotlight index (隐藏相簿与锁定备忘录不会被搜到) ---------- */
function spotlight(q){
  q = q.trim(); if (!q) return [];
  const out = [];
  Object.entries(NAMES).forEach(([id, n]) => { if (n.toLowerCase().includes(q.toLowerCase())) out.push(['应用', n, '', () => openDeep(id)]); });
  Object.entries(CONTACTS).forEach(([id, c]) => { if (c.n.includes(q)) out.push(['联系人', c.n, c.ph, () => openDeep('phone', 'contact', id)]); });
  CHATS.forEach(c => { if (c.name.includes(q)) out.push(['KakaoTalk', c.name, plain(c.last.text, c.last.me), () => openDeep('kakao', 'kchat', c.id)]); });
  NOTES.forEach((n, i) => { if (!n.lock && (n.t.includes(q) || n.b.includes(q))) out.push(['备忘录', n.t, shortD(n.d), () => openDeep('notes', 'note', i)]); });
  FILES.forEach((f, i) => { if (f[0].toLowerCase().includes(q.toLowerCase())) out.push(['文件', f[0], `${f[5]} · ${shortD(f[1])}`, () => openDeep('files', 'file', i)]); });
  PHOTOS.forEach(p => { if (p.key && visible(p) && p.c.includes(q)) out.push(['照片', p.c, ymd(p.d), () => openDeep('photos', 'photo', p.id)]); });
  CAL.forEach((e, i) => { if (e[4] !== 'c' && e[1].includes(q)) out.push(['日历', e[1], ymd(e[0]), () => openDeep('calendar', 'calev', i)]); });
  return out.slice(0, 30);
}

/* =========================================================
   LIVE — 真正能用的部分：可编辑的 App + 自动保存进度
   玩家在这台手机上做的事（写备忘录、发消息、点赞、评论、勾提醒……）
   都保存在玩家自己的浏览器里，下次打开接着玩。
   ========================================================= */
const nowHM = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const SAVE_KEY = 'taesan-phone-v1';
let saveT;
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }

/* ---------- Instagram 私信：记录玩家自己发的消息 ---------- */
function igAdd(t, texts){
  const L = igParse(t); t.mine = t.mine || [];
  texts.forEach(text => { const time = nowHM(); L.push({ me:true, who:'', time, d:TODAY, text, rx:'' }); t.mine.push({ time, text, d:TODAY }); });
  saveSoon();
}

/* ---------- KakaoTalk：真的能发消息 ---------- */
function kkAdd(c, text, time = nowHM(), d = TODAY){
  const last = c.list[c.list.length - 1];
  if (!last || last.d !== d) c.list.push({ t:'d', d });
  const m = { t:'m', me:true, who:'', time, text, d };
  c.list.push(m); c.last = m; c.unread = 0;
}
const _kchat = R.kchat;
R.kchat = id => {
  const s = _kchat(id), c = CHATS.find(x => x.id === id);
  s.bottom = s.bottom
    .replace(/<div class="k-field[^"]*">[\s\S]*?<\/div>/, `<input class="k-field" id="kin" type="text" value="${esc(c.draft || '')}" autocomplete="off" enterkeyhint="send">`)
    .replace('<span class="k-send" data-toast="原型中不能发送消息">#</span>', `<span class="k-send ${c.draft ? 'on' : ''}">#</span>`);
  const m0 = s.mount;
  s.mount = v => {
    m0(v);
    const inp = v.querySelector('#kin'), sb = v.querySelector('.k-send'), sc = v.querySelector('.vs');
    inp.addEventListener('input', () => { c.draft = inp.value; sb.classList.toggle('on', !!inp.value.trim()); saveSoon(); });
    const send = () => {
      const t = inp.value.trim(); if (!t) return;
      kkAdd(c, t); c.mine = (c.mine || []).concat({ d:TODAY, time:c.last.time, text:t }); c.draft = '';
      v.querySelector('.k-list').innerHTML = renderChat(c); inp.value = ''; sb.classList.remove('on'); sc.scrollTop = sc.scrollHeight; saveSoon();
    };
    sb.addEventListener('click', send);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(); } });
  };
  return s;
};

/* ---------- 信息（短信）：能发 ---------- */
const _smst = R.smst;
R.smst = i => {
  const s = _smst(i), sm = SMS[i];
  s.bottom = `<div class="sms-in"><span>+</span><input id="smsin" type="text" placeholder="${sm.imsg ? 'iMessage 信息' : '短信'}" autocomplete="off" enterkeyhint="send"><b class="sms-go" hidden>↑</b></div>`;
  s.mount = v => {
    const inp = v.querySelector('#smsin'), go = v.querySelector('.sms-go'), sc = v.querySelector('.vs'); sc.scrollTop = sc.scrollHeight;
    inp.addEventListener('input', () => { go.hidden = !inp.value.trim(); });
    const send = () => { const t = inp.value.trim(); if (!t) return; sm.m.push(['out', t, '已送达']); sm.mine = (sm.mine || []).concat(t); sm.d = TODAY; saveSoon(); replaceView(R.smst(i)); };
    go.addEventListener('click', send);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); send(); } });
  };
  return s;
};

/* ---------- 提醒事项：能勾选、能新建 ---------- */
R.rem = i => { const l = REMS[i];
  const item = (x, k) => `<div class="rem-i ${x[2] ? 'done' : ''}" data-ri="${k}"><i style="border-color:${x[2] ? l.c : '#c7c7cc'};background:${x[2] ? l.c : 'transparent'}"></i><div><b>${esc(x[0])}</b>${x[1] ? `<small>${esc(x[1])}</small>` : ''}</div></div>`;
  return { tone:'auto', cls:'rem', top:nb('', { back:'列表', tint:l.c, right:SVGI.dots }),
    body:`<div class="navtitle" style="color:${l.c};padding-top:6px">${l.n}</div><div class="rem-list">${l.items.map((x, k) => x[2] ? '' : item(x, k)).join('')}</div>
      <div class="rem-i rem-new"><i style="border-color:#c7c7cc"></i><div><input id="remin" type="text" placeholder="新提醒事项" autocomplete="off" enterkeyhint="done"></div></div>
      <div class="rem-more" data-showdone>${l.items.filter(x => x[2]).length} 项已完成 · <span style="color:${l.c}">显示</span></div><div class="rem-donelist" hidden>${l.items.map((x, k) => x[2] ? item(x, k) : '').join('')}</div>`,
    mount:v => {
      v.addEventListener('click', e => {
        const r = e.target.closest('[data-ri]');
        if (r && e.target.closest('i')) { const x = l.items[+r.dataset.ri]; x[2] = x[2] ? 0 : 1; saveSoon(); r.classList.toggle('done', !!x[2]); const ic = r.querySelector('i'); ic.style.background = x[2] ? l.c : 'transparent'; ic.style.borderColor = x[2] ? l.c : '#c7c7cc'; setTimeout(() => replaceView(R.rem(i)), 650); return; }
        if (e.target.closest('[data-showdone]')) { const d = v.querySelector('.rem-donelist'); d.hidden = !d.hidden; }
      });
      const inp = v.querySelector('#remin');
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && inp.value.trim()) { e.preventDefault(); l.items.push([inp.value.trim(), '今天', 0]); saveSoon(); replaceView(R.rem(i)); setTimeout(() => { const n = topView().querySelector('#remin'); n && n.focus(); }, 50); } });
    } }; };

function xSheet(v, items){
  const sh = document.createElement('div'); sh.className = 'xx-sheet';
  sh.innerHTML = `<div class="xx-shb"></div><div class="xx-shp"><i class="xx-grab"></i>${items.map(([l, cls], i) => `<div class="xx-shi ${cls || ''}" data-i="${i}">${l}</div>`).join('')}<div class="xx-shc">取消</div></div>`;
  v.append(sh); requestAnimationFrame(() => sh.classList.add('on'));
  const close = () => { sh.classList.remove('on'); setTimeout(() => sh.remove(), 300); };
  sh.addEventListener('click', e => { e.stopPropagation(); const it = e.target.closest('[data-i]'); if (it) { close(); items[+it.dataset.i][2](); } else if (e.target.closest('.xx-shb,.xx-shc')) close(); });
}
function xSync(v, p){
  v.querySelectorAll(`[data-xa$="|${p.id}"]`).forEach(el => {
    const k = el.dataset.xa.split('|')[0], em = el.querySelector('em');
    if (k === 'like') { el.classList.toggle('on-lk', !!p.liked); el.innerHTML = (p.liked ? XI.heartOn : XI.heart) + `<em>${xFmt(p.lk)}</em>`; if (p.liked) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } }
    if (k === 'rt') { el.classList.toggle('on-rt', !!p.rted); em.textContent = xFmt(p.rts); }
    if (k === 'bm') { el.classList.toggle('on-bm', !!p.bm); el.innerHTML = (p.bm ? XI.bmOn : XI.bm) + (el.tagName === 'SPAN' ? `<em>${xFmt(xBmN(p))}</em>` : ''); }
    if (k === 'reply' && em) em.textContent = xFmt(p.rp);
  });
  v.querySelectorAll(`[data-xc$="|${p.id}"]`).forEach(el => { const k = el.dataset.xc.split('|')[0]; el.textContent = xFmt(k === 'lk' ? p.lk : k === 'rt' ? p.rts : k === 'bm' ? (p.bm ? 1 : 0) : p.rp) || '0'; });
}
function xAct(v, e){
  const a = e.target.closest('[data-xa]'); if (!a) return; e.stopPropagation();
  const [k, id] = a.dataset.xa.split('|'), p = XP[id]; if (!p && k !== 'views') return;
  if (k === 'like') { p.liked = !p.liked; p.lk += p.liked ? 1 : -1; XS.like[id] = p.liked; xSync(v, p); xSave(); }
  else if (k === 'bm') { p.bm = !p.bm; XS.bm[id] = p.bm; xSync(v, p); toast(p.bm ? '已添加到书签' : '已从书签中移除'); xSave(); }
  else if (k === 'rt') xSheet(v, [[p.rted ? '撤销转帖' : '转帖', '', () => { p.rted = p.rted ? '' : TODAY; p.rts += p.rted ? 1 : -1; XS.rt[id] = p.rted; xSync(v, p); toast(p.rted ? '已转帖' : '已撤销转帖'); xSave(); }], ['引用', '', () => pushView(R.xcompose('q:' + id))]]);
  else if (k === 'reply') pushView(R.xcompose(id));
  else if (k === 'share') xSheet(v, [['复制链接', '', () => toast('已复制到剪贴板')], ['通过私信发送', '', () => pushView(R.xnewdm('share:' + id))]]);
  else if (k === 'views') toast('查看次数：看过这个帖子的次数');
  else if (k === 'more') {
    if (p.u === X_ME) xSheet(v, [['删除帖子', 'red', () => { xDel(id); XS.created = XS.created.filter(c => c.id !== id); if (!id.startsWith('c')) XS.deleted.push(id); xSave(); toast('你的帖子已删除'); const top = topView(); if (top._spec.xpost === id) popView(); else replaceView(top._spec.refresh()); }], ['置顶到个人资料', '', () => toast('已置顶')]]);
    else { const f = XFOLLOW.has(p.u); xSheet(v, [[`${f ? '取消关注' : '关注'} @${p.u}`, '', () => xFollow(p.u)], [`隐藏 @${p.u}`, '', () => toast(`已隐藏 @${p.u}`)], ['屏蔽', 'red', () => toast('原型中不能屏蔽')], ['举报帖子', 'red', () => toast('已收到你的举报')]]); }
  }

function xFollow(u){ const f = !XFOLLOW.has(u); f ? XFOLLOW.add(u) : XFOLLOW.delete(u); XS.follow[u] = f; xSave(); toast(f ? `已关注 @${u}` : `已取消关注 @${u}`); }
/* 所有 X 页面都走这里：返回时自动刷新，统一处理点赞等 */

        ${sec('媒体类型', `<div class="pp-g3">${media.map(([n, ic, c]) => `<div ${c ? `data-go="phalb|${n}"` : `data-toast="没有${n}"`}><i>${PHU[ic]}</i><span>${n}</span></div>`).join('')}</div>`, 'phalb|最近项目')}

        <div class="pp-sec"><div class="pp-st"><b>墙纸建议</b><i class="r" data-toast="原型中暂不可用">${PHI.chevR}</i></div></div><div class="pp-line"></div><div class="pp-reorder" data-toast="原型中暂不可用">重新排序</div><div class="pp-end"></div>`,
      over:phBar('col'), refresh:() => R.phcol(),
      mount:v => v.querySelectorAll('[data-fold]').forEach(f => f.addEventListener('click', e => { e.stopPropagation(); f.closest('.pp-sec').classList.toggle('folded'); })) }; },
  /* 相簿 / 回忆 / 某一天 */
  phalb: n => { const ps = phCtxList(n);

  phmem: k => { const ps = k === 'night' ? phVis().filter(p => +p.dt.slice(11, 13) >= 19 || +p.dt.slice(11, 13) < 3).filter(p => p.p) : phCtxList(k); const hero = ps[ps.length - 1];

  phday: d => { const ps = phVis().filter(p => p.d === d);

      over:`<div class="pp-nav"><span class="pp-cb" data-back>${PHI.back}</span></div>` }; },
  /* 搜索 */
  phsearch: () => ({ tone:'dark', bg:'#000', cls:'pp pp-srch',
    body:`<div class="pp-sh"><label>${PHI.search}<input id="phq" placeholder="照片、人物、地点……" autocomplete="off" enterkeyhint="search"></label><span data-back>取消</span></div>
      <div id="phsr"><div class="pp-sug">${['首尔', '朋友', '夜晚', '拉面', '2023', '汉江公园', '截屏'].map(s => `<span data-q="${s}">${s}</span>`).join('')}</div></div>`,
    mount:v => { const q = v.querySelector('#phq'), r = v.querySelector('#phsr'), sug = r.innerHTML;
      const run = () => { const w = q.value.trim(); if (!w) { r.innerHTML = sug; return; } const ps = phVis().filter(p => (p.c + ' ' + p.p + ' ' + p.al.join(' ') + ' ' + p.d + ' ' + p.cap).includes(w));
        r.innerHTML = ps.length ? `<div class="pp-rc">${ps.length} 张照片</div><div class="pp-grid c3">${ps.map(p => phTile2(p)).join('')}</div>` : `<div class="pp-none">没有“${esc(w)}”的结果</div>`; };
      q.addEventListener('input', run); v.addEventListener('click', e => { const s = e.target.closest('[data-q]'); if (s) { q.value = s.dataset.q; run(); } }); setTimeout(() => q.focus(), 350); } }),
  /* 单张照片：左右划动切换（手指 / 鼠标拖动都可以） */
  photo: a => { const [id, ctx] = String(a).split('~'); const list = phCtxList(ctx); let i = list.indexOf(PHOTOS[+id]); if (i < 0) i = 0;
    return { tone:'dark', bg:'#000', cls:'pp pp-one',
      body:`<div class="pp-stage"><div class="pp-track">${list.map((x, k) => `<div class="pp-slide"><img ${Math.abs(k - i) < 3 ? 'src' : 'data-src'}="${x.s.slice(4)}" alt="" draggable="false"></div>`).join('')}</div><i class="pp-live" hidden>${PHI.live}实况</i></div><div class="pp-info"></div>`,
      over:`<div class="pp-otop"><span class="pp-cb" data-back>${PHI.back}</span><div class="pp-when2"><b></b><small></small></div><span class="pp-cb" data-toast="原型中暂不可用">${PHI.dots}</span></div>
        <div class="pp-obot"><div class="pp-strip"></div>
          <div class="pp-tools"><span class="pp-cb" data-toast="原型中不能分享">${PHI.share}</span><div class="pp-cap3"><span data-phfav></span><span data-phinfo>${PHI.info}</span><span data-toast="原型中不能编辑照片">${PHI.adjust}</span></div><span class="pp-cb" data-phdel></span></div></div>`,
      mount:v => {
        const tr = v.querySelector('.pp-track'), info = v.querySelector('.pp-info'), strip = v.querySelector('.pp-strip');
        const favB = v.querySelector('[data-phfav]'), delB = v.querySelector('[data-phdel]'), live = v.querySelector('.pp-live');
        let cur = -1;
        const show = k => { k = Math.max(0, Math.min(list.length - 1, k)); if (k === cur) return; cur = k; const p = list[k];
          tr.querySelectorAll('img').forEach((im, j) => { if (Math.abs(j - k) < 3 && im.dataset.src) { im.src = im.dataset.src; delete im.dataset.src; } });
          v.querySelector('.pp-when2 b').textContent = phDay(p.d); v.querySelector('.pp-when2 small').textContent = p.dt.slice(11);
          const fav = p.f.includes('f'); favB.classList.toggle('on', fav); favB.innerHTML = fav ? PHI.heartOn : PHI.heart;
          delB.innerHTML = p.f.includes('d') ? '<b style="font-size:13px;font-weight:600">恢复</b>' : PHI.trash; live.hidden = !p.f.includes('l');
          const lo = Math.max(0, k - 7); strip.innerHTML = list.slice(lo, k + 8).map((x, j) => `<i class="${lo + j === k ? 'on' : ''}" data-k="${lo + j}" style="background-image:url(assets/ph/t/${x.n}.jpg)"></i>`).join('');
          const dev = phDev(p), [y, mo, dd] = p.d.split('-');

            ${p.p ? `<div class="pp-map" data-toast="${p.p}"><div class="pp-mapi"><i style="background-image:url(assets/ph/t/${p.n}.jpg)"></i></div><b>${p.p}</b></div>` : ''}

        const goTo = (k, smooth) => { tr.scrollTo({ left:k * W0(), behavior:smooth ? 'smooth' : 'auto' }); show(k); };
        requestAnimationFrame(() => goTo(i));
        let st; tr.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => show(Math.round(tr.scrollLeft / W0())), 60); }, { passive:true });
        /* 鼠标拖动（电脑上看的时候） */
        let pid = null, sx = 0, sl = 0, moved = false;
        tr.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' || e.button) return; pid = e.pointerId; sx = e.clientX; sl = tr.scrollLeft; moved = false; tr.style.scrollSnapType = 'none'; });
        window.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; const k = screen.getBoundingClientRect().width / W; const dx = (e.clientX - sx) / k; if (Math.abs(dx) > 4) moved = true; tr.scrollLeft = sl - dx; });
        window.addEventListener('pointerup', e => { if (e.pointerId !== pid) return; pid = null; const w = W0(), dx = sl - tr.scrollLeft; let k = Math.round(sl / w); if (dx < -w * .12) k++; else if (dx > w * .12) k--; k = Math.max(0, Math.min(list.length - 1, k)); tr.scrollTo({ left:k * w, behavior:'smooth' }); setTimeout(() => { tr.style.scrollSnapType = ''; show(k); }, 350); });
        /* 上划看信息、下划关闭 */
        let ty = null, tx = 0; tr.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
        tr.addEventListener('touchend', e => { if (ty == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; ty = null;
          if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx) * 1.5) { if (dy < 0) v.classList.add('info'); else v.classList.contains('info') ? v.classList.remove('info') : popView(); } });
        tr.addEventListener('click', () => { if (moved) { moved = false; return; } v.classList.toggle('chrome-off'); });

        v.querySelector('[data-phinfo]').addEventListener('click', e => { e.stopPropagation(); v.classList.toggle('info'); e.currentTarget.innerHTML = v.classList.contains('info') ? PHI.infoOn : PHI.info; requestAnimationFrame(() => tr.scrollTo({ left:cur * W0() })); });
        favB.addEventListener('click', e => { e.stopPropagation(); const p = list[cur], on = !p.f.includes('f'); p.f = on ? p.f + 'f' : p.f.replace('f', ''); PS.fav[p.n] = on; phSave(); favB.classList.toggle('on', on); favB.innerHTML = on ? PHI.heartOn : PHI.heart; });
        delB.addEventListener('click', e => { e.stopPropagation(); const p = list[cur];
          if (p.f.includes('d')) { p.f = p.f.replace('d', ''); delete PS.del[p.n]; phSave(); toast('已恢复照片'); popView(); return; }
          const sh = document.createElement('div'); sh.className = 'pp-del'; sh.innerHTML = `<div class="pp-delb"></div><div class="pp-delp"><small>这张照片将从 iCloud 照片中删除，并会在“最近删除”中保留 30 天。</small><b>删除照片</b></div>`;
          v.append(sh); sh.addEventListener('click', ev => { ev.stopPropagation(); if (ev.target.closest('b')) { p.f += 'd'; PS.del[p.n] = 1; phSave(); sh.remove(); toast('已移到“最近删除”'); popView(); } else sh.remove(); }); });
      } }; },
});

/* =========================================================
   CLOCK — iOS 26 时钟（深色）：世界时钟 / 闹钟 / 秒表 / 计时器
   按钮都能用：增删城市、新建/编辑/删除闹钟、开关闹钟、秒表计次、计时器倒计时；
   城市、闹钟、最近计时器会保存（CK_SAVE_KEY）。
   ========================================================= */
const CK_SAVE_KEY = 'taesan-phone-clock-v1';
const CK_CITIES = { '首尔':'Asia/Seoul', '上海':'Asia/Shanghai', '纽约':'America/New_York', '东京':'Asia/Tokyo', '京都':'Asia/Tokyo', '伦敦':'Europe/London', '巴黎':'Europe/Paris', '洛杉矶':'America/Los_Angeles', '悉尼':'Australia/Sydney', '温哥华':'America/Vancouver', '曼谷':'Asia/Bangkok', '大阪':'Asia/Tokyo', '台北':'Asia/Taipei', '香港':'Asia/Hong_Kong', '新加坡':'Asia/Singapore', '柏林':'Europe/Berlin', '多伦多':'America/Toronto', '釜山':'Asia/Seoul' };
const CK = { cities:['首尔', '上海', '纽约'], alarms:[
  { t:'06:15', l:'', on:0, r:'' }, { t:'06:25', l:'', on:0, r:'' }, { t:'07:00', l:'考试 ×3 别睡过头', on:1, r:'' }, { t:'07:15', l:'', on:0, r:'' },
  { t:'07:30', l:'上学', on:0, r:'每个工作日' }, { t:'07:40', l:'', on:0, r:'' }, { t:'22:30', l:'交作品集', on:1, r:'' } ], recents:[[0, 15, 0], [0, 25, 0], [0, 5, 0]], label:'计时器' };
try { Object.assign(CK, JSON.parse(localStorage.getItem(CK_SAVE_KEY) || '{}')); } catch (e) {}
const ckSave = () => { if (typeof resetting !== 'undefined' && resetting) return; try { localStorage.setItem(CK_SAVE_KEY, JSON.stringify(CK)); } catch (e) {} };
const SW = { run:false, t0:0, acc:0, laps:[] };            // 秒表
const TM = { h:0, m:15, s:0, run:false, paused:false, end:0, left:0, total:0 };   // 计时器
let ckEdit = false;

const CKI = {
  world:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3zM4.8 7.5h14.4M4.8 16.5h14.4"/></svg>',
  alarm:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5.5a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm-.9 3.5v5.2l3.6 2.2.9-1.4-2.7-1.7V9z"/><path d="M3.2 6.6 6.8 3.4l1 1.2-3.6 3.2zM20.8 6.6l-3.6-3.2-1 1.2 3.6 3.2z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 1.8h4v1.9h-4z"/><path d="M12 5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17zm-.8 3v6h1.6V8z"/><path d="m18 5.4 1.6 1.4-1 1.1-1.6-1.4z"/></svg>',
  timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3.5a8.5 8.5 0 1 1-6 2.5"/><path d="M12 3.5V7M12 12 8 8"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  bed:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 6h2v7h18v6h-2v-2.5H4V19H2z"/><path d="M5.5 8.5h5.5v4H5.5zM12 8.5h6.5a3 3 0 0 1 3 3v1.5H12z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  minus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ff3b30"/><path d="M7 12h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
};
const ckTZ = tz => { const f = new Intl.DateTimeFormat('en-GB', { timeZone:tz, hour:'2-digit', minute:'2-digit', year:'numeric', month:'2-digit', day:'2-digit', hour12:false }).formatToParts(new Date()); const g = k => f.find(x => x.type === k).value; return { hm:`${g('hour') === '24' ? '00' : g('hour')}:${g('minute')}`, d:`${g('year')}-${g('month')}-${g('day')}` }; };
const ckOff = tz => { const n = new Date(); const a = new Date(n.toLocaleString('en-US', { timeZone:tz })), b = new Date(n.toLocaleString('en-US')); return Math.round((a - b) / 36e5); };
const ckLocalD = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; };
const swFmt = ms => { const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000); return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`; };
const swNow = () => SW.acc + (SW.run ? performance.now() - SW.t0 : 0);
const tmLeft = () => TM.run ? (TM.paused ? TM.left : Math.max(0, TM.end - Date.now())) : 0;
const tmFmt = ms => { const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; };
const ckSw = on => `<i class="ck-sw ${on ? 'on' : ''}"></i>`;

/* 滚轮选择器 */
const ckWheel = (n, sel, cls = '', fmt = x => x) => `<div class="ck-wh ${cls}" data-sel="${sel}"><div class="ck-whs">${Array.from({ length:n }, (_, i) => `<i>${fmt(i)}</i>`).join('')}</div></div>`;
function ckWheelMount(root, onChange){
  root.querySelectorAll('.ck-wh').forEach(w => { const s = w.querySelector('.ck-whs'), items = [...s.children];
    const ih = () => items[0].offsetHeight || 1;
    const mark = () => { const k = Math.round(s.scrollTop / ih()); items.forEach((it, j) => it.classList.toggle('on', j === k)); return k; };
    requestAnimationFrame(() => { s.scrollTop = +w.dataset.sel * ih(); mark(); });
    let t; s.addEventListener('scroll', () => { const k = mark(); clearTimeout(t); t = setTimeout(() => { w.dataset.sel = k; onChange && onChange(); }, 90); }, { passive:true });
    items.forEach((it, j) => it.addEventListener('click', e => { e.stopPropagation(); s.scrollTo({ top:j * ih(), behavior:'smooth' }); }));
    /* 电脑上可以用鼠标拖 */
    let pid = null, sy = 0, st = 0;
    s.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' || e.button) return; pid = e.pointerId; sy = e.clientY; st = s.scrollTop; s.style.scrollSnapType = 'none'; e.preventDefault(); });
    window.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; const k = screen.getBoundingClientRect().width / W; s.scrollTop = st - (e.clientY - sy) / k; });
    window.addEventListener('pointerup', e => { if (e.pointerId !== pid) return; pid = null; s.style.scrollSnapType = ''; s.scrollTo({ top:Math.round(s.scrollTop / ih()) * ih(), behavior:'smooth' }); });
  });
}

const ckTabs = on => `<div class="ck-tab">${[['world', '世界时钟'], ['alarm', '闹钟'], ['stop', '秒表'], ['timer', '计时器']].map(([k, l]) => `<span class="${k === on ? 'on' : ''}" data-tab="clock|${k}">${CKI[k]}<em>${l}</em></span>`).join('')}</div>`;
const ckTop = (l, r) => `<div class="ck-top">${l ? `<span class="ck-pill" data-ck="edit">${ckEdit ? '完成' : '编辑'}</span>` : '<span></span>'}${r ? `<span class="ck-cb" data-ck="add">${CKI.plus}</span>` : ''}</div>`;

R.clock = tab => { tab = tab || 'world'; let body = '', top = '';
  if (tab === 'world') { top = ckTop(1, 1); const here = ckLocalD();
    body = `<div class="ck-lt">世界时钟</div>${CK.cities.map((c, i) => { const z = ckTZ(CK_CITIES[c] || 'Asia/Seoul'), o = ckOff(CK_CITIES[c] || 'Asia/Seoul'), day = z.d === here ? '今天' : z.d > here ? '明天' : '昨天';
      return `<div class="ck-wc ${ckEdit ? 'ed' : ''}">${ckEdit ? `<i class="ck-del" data-delc="${i}">${CKI.minus}</i>` : ''}<div><small>${day}，${o >= 0 ? '+' : '−'}${Math.abs(o)}小时</small><b>${c}</b></div><span class="ck-big" data-tz="${CK_CITIES[c]}">${z.hm}</span></div>`; }).join('')}
      ${CK.cities.length ? '' : '<div class="ck-none">没有世界时钟</div>'}`; }
  else if (tab === 'alarm') { top = ckTop(1, 1); const al = CK.alarms.map((a, i) => [a, i]).sort((x, y) => x[0].t.localeCompare(y[0].t));
    body = `<div class="ck-lt">闹钟</div><div class="ck-sh">${CKI.bed}<b>睡眠 | 起床闹钟</b></div><div class="ck-sleep"><span>无闹钟</span><em data-toast="请在「健康」中设置睡眠计划">设置</em></div>
      <div class="ck-sh o"><b>其他</b></div>${al.map(([a, i]) => `<div class="ck-al ${a.on ? 'on' : ''} ${ckEdit ? 'ed' : ''}" data-ali="${i}">${ckEdit ? `<i class="ck-del" data-dela="${i}">${CKI.minus}</i>` : ''}<div class="ck-alt"><b>${a.t}</b><small>${a.l ? esc(a.l) : '闹钟'}${a.r ? '，' + a.r : ''}</small></div>${ckEdit ? `<i class="ck-chev">${CKI.chev}</i>` : `<span data-alsw="${i}">${ckSw(a.on)}</span>`}</div>`).join('')}<div class="ck-end"></div>`; }
  else if (tab === 'stop') {
    const laps = SW.laps.map((x, i) => [x, i]); const best = laps.length > 2 ? Math.min(...SW.laps) : -1, worst = laps.length > 2 ? Math.max(...SW.laps) : -1;
    body = `<div class="ck-swd" id="swd">${swFmt(swNow())}</div>
      <div class="ck-btns"><span class="ck-rb ${!SW.run && !SW.acc ? 'dis' : ''}" data-ck="lap">${!SW.run && SW.acc ? '复位' : '计次'}</span><span class="ck-dots"><i class="on"></i><i></i></span><span class="ck-rb ${SW.run ? 'red' : 'green'}" data-ck="ss">${SW.run ? '停止' : '启动'}</span></div>
      <div class="ck-laps" id="laps">${SW.run || SW.acc ? `<div class="ck-lap"><span>计次 ${SW.laps.length + 1}</span><span id="curlap">${swFmt(swNow() - SW.laps.reduce((a, b) => a + b, 0))}</span></div>` : ''}${laps.reverse().map(([x, i]) => `<div class="ck-lap ${x === best ? 'best' : x === worst ? 'worst' : ''}"><span>计次 ${i + 1}</span><span>${swFmt(x)}</span></div>`).join('')}</div>`; }
  else { top = ckTop(1, 0);
    if (TM.run) { const left = tmLeft();
      body = `<div class="ck-lt">计时器</div><div class="ck-run"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" class="bg"/><circle cx="100" cy="100" r="94" class="fg" id="tmring" style="stroke-dashoffset:${590.6 * (1 - left / TM.total)}"/></svg><div><small>🔔︎ ${CK.label}</small><b id="tmd">${tmFmt(left)}</b><small>${tmFmt(TM.total)}</small></div></div>
        <div class="ck-btns"><span class="ck-rb" data-ck="tcancel">取消</span><span></span><span class="ck-rb ${TM.paused ? 'green' : 'orange'}" data-ck="tpause">${TM.paused ? '继续' : '暂停'}</span></div>`; }
    else body = `<div class="ck-lt">计时器</div>
      <div class="ck-pick">${ckWheel(24, TM.h, 'h')}<em class="l1">小时</em>${ckWheel(60, TM.m, 'm')}<em class="l2">分钟</em>${ckWheel(60, TM.s, 's')}<em class="l3">秒</em><i class="ck-bar"></i></div>
      <div class="ck-btns"><span class="ck-rb dis">取消</span><span></span><span class="ck-rb green" data-ck="tstart">开始</span></div>
      <div class="ck-grp"><label><span>标签</span><input id="tml" value="${esc(CK.label)}" placeholder="计时器"></label><div data-toast="提醒声：雷达"><span>计时结束时</span><em>雷达 ${CKI.chev}</em></div></div>
      <div class="ck-rh">最近</div>${CK.recents.map(([h, m, s], i) => `<div class="ck-rc"><div><b>${h ? h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') : String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')}</b><small>${[h ? h + ' 小时' : '', m ? m + ' 分钟' : '', s ? s + ' 秒' : ''].filter(Boolean).join(' ')}</small></div><span data-rc="${i}">${CKI.play}</span></div>`).join('')}<div class="ck-end"></div>`;
  }
  return { tone:'dark', bg:'#000', cls:'ck ck-' + tab, top, body, bottom:'', over:ckTabs(tab), refresh:() => R.clock(tab),
    mount:v => {
      const re = () => replaceView(R.clock(tab));
      const ed = v.querySelector('[data-ck="edit"]'); ed && ed.addEventListener('click', e => { e.stopPropagation(); ckEdit = !ckEdit; re(); });
      const add = v.querySelector('[data-ck="add"]'); add && add.addEventListener('click', e => { e.stopPropagation(); tab === 'world' ? ckCityPicker(v, re) : ckAlarmSheet(v, -1, re); });
      v.querySelectorAll('[data-delc]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); CK.cities.splice(+b.dataset.delc, 1); ckSave(); re(); }));
      v.querySelectorAll('[data-dela]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); CK.alarms.splice(+b.dataset.dela, 1); ckSave(); re(); }));
      v.querySelectorAll('[data-alsw]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const a = CK.alarms[+b.dataset.alsw]; a.on = a.on ? 0 : 1; ckSave(); b.innerHTML = ckSw(a.on); b.closest('.ck-al').classList.toggle('on', !!a.on); }));
      v.querySelectorAll('[data-ali]').forEach(r => r.addEventListener('click', e => { if (e.target.closest('[data-alsw],[data-dela]')) return; ckAlarmSheet(v, +r.dataset.ali, re); }));
      /* 秒表 */
      const ss = v.querySelector('[data-ck="ss"]'); ss && ss.addEventListener('click', () => { if (SW.run) { SW.acc += performance.now() - SW.t0; SW.run = false; } else { SW.t0 = performance.now(); SW.run = true; } re(); });
      const lap = v.querySelector('[data-ck="lap"]'); lap && lap.addEventListener('click', () => { if (SW.run) { SW.laps.push(swNow() - SW.laps.reduce((a, b) => a + b, 0)); re(); } else if (SW.acc) { SW.acc = 0; SW.laps = []; re(); } });
      /* 计时器 */
      if (tab === 'timer' && !TM.run) ckWheelMount(v, () => { const g = c => +v.querySelector('.ck-wh.' + c).dataset.sel; TM.h = g('h'); TM.m = g('m'); TM.s = g('s'); });
      const tl = v.querySelector('#tml'); tl && tl.addEventListener('input', () => { CK.label = tl.value || '计时器'; ckSave(); });
      const startT = (h, m, s) => { const tot = (h * 3600 + m * 60 + s) * 1000; if (!tot) return toast('请先选择时间'); Object.assign(TM, { h, m, s, run:true, paused:false, total:tot, end:Date.now() + tot });
        CK.recents = [[h, m, s], ...CK.recents.filter(r => r.join() !== [h, m, s].join())].slice(0, 5); ckSave(); re(); };
      const st = v.querySelector('[data-ck="tstart"]'); st && st.addEventListener('click', () => startT(TM.h, TM.m, TM.s));
      v.querySelectorAll('[data-rc]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const [h, m, s] = CK.recents[+b.dataset.rc]; startT(h, m, s); }));
      const tc = v.querySelector('[data-ck="tcancel"]'); tc && tc.addEventListener('click', () => { TM.run = false; re(); });
      const tp = v.querySelector('[data-ck="tpause"]'); tp && tp.addEventListener('click', () => { if (TM.paused) { TM.end = Date.now() + TM.left; TM.paused = false; } else { TM.left = tmLeft(); TM.paused = true; } re(); });
      /* 实时刷新 */
      const loop = () => { if (!v.isConnected) return;
        const d = v.querySelector('#swd'); if (d) { d.textContent = swFmt(swNow()); const c = v.querySelector('#curlap'); if (c) c.textContent = swFmt(swNow() - SW.laps.reduce((a, b) => a + b, 0)); }
        const td = v.querySelector('#tmd'); if (td) { const l = tmLeft(); td.textContent = tmFmt(l); v.querySelector('#tmring').style.strokeDashoffset = 590.6 * (1 - l / TM.total); if (TM.run && !TM.paused && l <= 0) { TM.run = false; ckRing(CK.label, '计时结束'); re(); return; } }
        v.querySelectorAll('[data-tz]').forEach(x => { x.textContent = ckTZ(x.dataset.tz).hm; });
        requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    } }; };
ROOT.clock = () => R.clock();

/* 底部弹出的表单 */
function ckSheet(v, html){ const sh = document.createElement('div'); sh.className = 'ck-sheet'; sh.innerHTML = `<div class="ck-shb"></div><div class="ck-shp">${html}</div>`; v.append(sh); requestAnimationFrame(() => sh.classList.add('on'));
  const close = () => { sh.classList.remove('on'); setTimeout(() => sh.remove(), 300); }; sh.querySelector('.ck-shb').addEventListener('click', close); sh.addEventListener('click', e => e.stopPropagation()); return [sh, close]; }
function ckAlarmSheet(v, idx, done){
  const a = idx >= 0 ? CK.alarms[idx] : { t:nowHM(), l:'', on:1, r:'' }; const [hh, mm] = a.t.split(':').map(Number);
  const [sh, close] = ckSheet(v, `<div class="ck-sht"><span data-x>取消</span><b>${idx >= 0 ? '编辑闹钟' : '添加闹钟'}</b><span class="or" data-ok>存储</span></div>
    <div class="ck-pick al">${ckWheel(24, hh, 'h', x => String(x).padStart(2, '0'))}${ckWheel(60, mm, 'm', x => String(x).padStart(2, '0'))}<i class="ck-bar"></i></div>
    <div class="ck-grp"><div data-rep><span>重复</span><em><b id="rep">${a.r || '永不'}</b> ${CKI.chev}</em></div><label><span>标签</span><input id="all" value="${esc(a.l)}" placeholder="闹钟"></label><div data-toast="提醒声：雷达"><span>提醒声</span><em>雷达 ${CKI.chev}</em></div><div><span>稍后提醒</span><span data-snz>${ckSw(1)}</span></div></div>
    ${idx >= 0 ? '<div class="ck-grp"><div class="ck-delr" data-del>删除闹钟</div></div>' : ''}`);
  ckWheelMount(sh);
  const reps = ['永不', '每天', '每个工作日', '每个周末'];
  sh.querySelector('[data-rep]').addEventListener('click', () => { const r = sh.querySelector('#rep'); r.textContent = reps[(reps.indexOf(r.textContent) + 1) % reps.length]; });
  sh.querySelector('[data-snz]').addEventListener('click', e => { const on = !e.currentTarget.querySelector('.on'); e.currentTarget.innerHTML = ckSw(on); });

/* ---------- calculator ---------- */
function mountCalc(){
  let cur = '0', prev = null, op = null, fresh = false;
  const disp = $('#cDisp'), ac = $('#cAC');
  const fmt = n => {
    if (!isFinite(n)) return '错误';
    if (Math.abs(n) >= 1e9 || (Math.abs(n) < 1e-8 && n !== 0)) return n.toExponential(4).replace('+','');
    return String(parseFloat(n.toPrecision(9)));
  };
  const show = () => {
    let t = cur;
    if (/^-?\d+(\.\d*)?$/.test(t)){ const [a,b] = t.split('.'); t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b !== undefined ? '.' + b : ''); }
    disp.textContent = t;
    const len = t.length; disp.style.fontSize = (len <= 6 ? 88 : len <= 8 ? 72 : len <= 10 ? 60 : 50) + 'px';
    ac.textContent = (cur !== '0' && !fresh) ? 'C' : 'AC';
    appbody.querySelectorAll('.op').forEach(b => b.classList.toggle('sel', fresh && b.dataset.k === op));
  };
  const calc = (a, b, o) => o === '+' ? a+b : o === '-' ? a-b : o === '*' ? a*b : a/b;
  appbody.querySelector('.keys').addEventListener('click', e => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    if (/\d/.test(k)){
      if (fresh || cur === '错误'){ cur = '0'; fresh = false; }
      if (cur.replace(/[-.]/g,'').length >= 9) return;
      cur = cur === '0' ? k : cur === '-0' ? '-' + k : cur + k;
    } else if (k === '.'){
      if (fresh){ cur = '0'; fresh = false; }
      if (!cur.includes('.')) cur += '.';
    } else if (k === 'ac'){
      if (ac.textContent === 'C'){ cur = '0'; } else { cur = '0'; prev = null; op = null; fresh = false; }
    } else if (k === 'neg'){
      cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; if (fresh) fresh = false;
    } else if (k === 'pct'){
      cur = fmt(parseFloat(cur) / 100);
    } else if (k === '='){
      if (op !== null && prev !== null){ cur = fmt(calc(prev, parseFloat(cur), op)); prev = null; op = null; fresh = true; }
    } else {
      if (op !== null && prev !== null && !fresh){ cur = fmt(calc(prev, parseFloat(cur), op)); }
      prev = parseFloat(cur); op = k; fresh = true;
    }
    show();
  });
  show();
}
