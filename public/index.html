<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="没能陪你走到最后">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>html,body{margin:0;height:100%;background:#000;overscroll-behavior:none;-webkit-text-size-adjust:100%}[hidden]{display:none!important}</style>
<title>没能陪你走到最后</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 393×852pt phone centered on a quiet stage, scaled down only when the window is too small */
:root{
  --stage:#e9ebf0; --stage-fg:#4a4f5c; --stage-mute:#8a90a0;
  --ios-blue:#0a84ff; --ios-green:#34c759; --ios-orange:#ff9f0a; --ios-red:#ff3b30;
  --app-bg:#f2f2f7; --app-cell:#ffffff; --app-fg:#000000; --app-sub:#8e8e93; --app-sep:rgba(60,60,67,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Noto Sans SC",system-ui,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#121317;--stage-fg:#c9ccd6;--stage-mute:#6c7180;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#121317;--stage-fg:#c9ccd6;--stage-mute:#6c7180;color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--stage);color:var(--stage-fg);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.fit{position:relative;flex:none}
.caption{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--stage-mute);letter-spacing:.02em}
.caption button{font:inherit;color:var(--stage-fg);background:none;border:1px solid currentColor;border-radius:999px;padding:3px 10px;cursor:pointer;opacity:.8}
.caption button:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px}

/* ---------- device ---------- */
.phone{position:absolute;left:0;top:0;width:421px;height:880px;transform-origin:0 0;
  border-radius:69px;background:linear-gradient(145deg,#4b4a48,#2a2a2a 40%,#3c3b39);padding:14px;box-sizing:border-box;
  box-shadow:0 0 0 1.5px #1b1b1b inset,0 0 0 4px #0b0b0b inset,0 30px 60px rgba(0,0,0,.28),0 8px 18px rgba(0,0,0,.18);user-select:none;-webkit-user-select:none}
.hw{position:absolute;background:linear-gradient(90deg,#2b2b2b,#555 50%,#2b2b2b);border-radius:3px;cursor:pointer;border:0;padding:0}
.hw.l{left:-3px;width:4px}.hw.r{right:-3px;width:4px}
.hw:active{filter:brightness(1.4)}
.screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:#000;color:#fff;
  font-family:var(--font);-webkit-font-smoothing:antialiased;touch-action:none;isolation:isolate}
.wall{position:absolute;inset:0;background:
  radial-gradient(120% 60% at 15% 10%,#ff8a5c 0%,rgba(255,138,92,0) 55%),
  radial-gradient(90% 55% at 95% 35%,#7a5cff 0%,rgba(122,92,255,0) 60%),
  radial-gradient(120% 70% at 30% 95%,#1f6bff 0%,rgba(31,107,255,0) 60%),
  linear-gradient(170deg,#2a1d4f,#0f1638 60%,#08122a);transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s}
.screen.in-app .wall{transform:scale(1.08);filter:blur(6px) brightness(.8)}
.screen.locked .wall{filter:brightness(.92)}

/* status bar + island */
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 0;pointer-events:none;transition:color .25s}
.status .time{width:140px;text-align:center;font-weight:600;font-size:17px;letter-spacing:-.2px;padding-top:4px;font-variant-numeric:tabular-nums}
.status .right{display:flex;gap:6px;align-items:center;padding-top:4px}
.status svg{display:block;fill:currentColor}
.screen.dark-status .status{color:#000}
.screen.locked .status .time{font-size:15px;font-weight:500}
.batt{width:27px;height:13px;border:1.2px solid currentColor;border-radius:4.3px;opacity:.95;position:relative;box-sizing:border-box;padding:1.5px}
.batt::after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:4px;border-radius:0 1px 1px 0;background:currentColor;opacity:.5}
.batt i{display:block;height:100%;width:80%;background:currentColor;border-radius:2px}
.island{position:absolute;left:50%;top:11px;width:125px;height:37px;margin-left:-62.5px;background:#000;border-radius:20px;z-index:70;
  transition:all .45s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;overflow:hidden;cursor:pointer}
.island .il,.island .ir{opacity:0;transition:opacity .2s;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.island.big{width:360px;margin-left:-180px;height:84px;border-radius:42px;top:9px;padding:0 22px}
.island.big .il,.island.big .ir{opacity:1;transition-delay:.15s}
.island.pill{width:200px;margin-left:-100px}
.island.pill .il,.island.pill .ir{opacity:1;transition-delay:.12s}

/* layers */
.layer{position:absolute;inset:0}
.home{z-index:10;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .45s}
.screen.locked .home{transform:scale(1.12);opacity:0;pointer-events:none}
.screen.in-app .home{transform:scale(.9);opacity:.0;pointer-events:none}
.pages{position:absolute;left:0;top:0;height:100%;display:flex;width:786px;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.page{width:393px;height:100%;box-sizing:border-box;padding:70px 25px 0}
.grid{display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;grid-auto-rows:86px;row-gap:22px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app .lbl{font-size:12px;line-height:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap;letter-spacing:-.1px}
.icon{width:62px;height:62px;border-radius:14.5px;position:relative;overflow:hidden;flex:none;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.icon svg{position:absolute;inset:0;width:100%;height:100%}
.app:active .icon{transform:scale(.92);filter:brightness(.8)}
.badge{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:#ff3b30;color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 6px;box-sizing:border-box;z-index:2}
.iconwrap{position:relative}
.badge[hidden]{display:none}
.jiggle .iconwrap{animation:jig .28s infinite alternate ease-in-out}
.jiggle .app:nth-child(2n) .iconwrap{animation-delay:-.14s;animation-direction:alternate-reverse}
@keyframes jig{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.jiggle .app:active .icon{transform:none;filter:none}
.widget{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;align-items:center;gap:6px}
.wbox{width:100%;height:164px;border-radius:22px;box-sizing:border-box;padding:14px 15px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.w-weather{background:linear-gradient(180deg,#3c8ce7,#5aa9f5)}
.w-weather .city{font-size:15px;font-weight:600;display:flex;align-items:center;gap:3px}
.w-weather .deg{font-size:44px;font-weight:300;line-height:1;margin-top:2px;letter-spacing:-1px}
.w-weather .sub{position:absolute;left:15px;bottom:13px;font-size:12.5px;font-weight:600;line-height:1.3}
.w-weather .sub span{display:block;font-weight:500;opacity:.9}
.w-cal{background:#fff;color:#000}
.w-cal .wd{color:#ff3b30;font-size:12px;font-weight:700;letter-spacing:.04em}
.w-cal .dn{font-size:40px;font-weight:300;line-height:1;margin-top:1px;letter-spacing:-1px}
.w-cal .ev{margin-top:10px;border-left:3px solid #ff9500;padding-left:7px;font-size:12px;line-height:1.3}
.w-cal .ev b{font-weight:600;display:block}.w-cal .ev span{color:#8e8e93}
.w-cal .ev+.ev{border-color:#30b0c7;margin-top:6px}
.dots{position:absolute;left:0;right:0;bottom:122px;display:flex;justify-content:center;gap:7px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .2s}
.dots i.on{background:#fff}
.search{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;font-weight:500;display:flex;align-items:center;gap:5px;z-index:2;cursor:pointer}
.home.jiggle .search,.home.paging .search{display:none}.home:not(.jiggle):not(.paging) .dots{display:none}
.dots{cursor:pointer}
.donebtn{position:absolute;right:20px;top:58px;z-index:3;background:rgba(255,255,255,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border:0;border-radius:14px;padding:5px 14px;font:600 14px var(--font);cursor:pointer;display:none}
.home.jiggle .donebtn{display:block}
.dock{position:absolute;left:12px;right:12px;bottom:12px;height:92px;border-radius:36px;background:rgba(255,255,255,.22);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  display:grid;grid-template-columns:repeat(4,62px);justify-content:space-between;align-items:center;padding:0 16px;box-sizing:border-box;z-index:2}
.dock .lbl{display:none}

/* lock screen */
.lock{z-index:40;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;display:flex;flex-direction:column;align-items:center}
.screen:not(.locked) .lock{transform:translateY(-100%);pointer-events:none}
.lock .lk{margin-top:62px;opacity:.9}
.lock .date{margin-top:6px;font-size:21px;font-weight:600;opacity:.92;letter-spacing:.02em}
.lock .bigtime{font-family:var(--font-num);font-size:104px;line-height:.95;font-weight:700;letter-spacing:-3px;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.8));-webkit-background-clip:text;background-clip:text;color:transparent}
.lock .notif{margin-top:auto;margin-bottom:150px;width:361px;border-radius:22px;background:rgba(255,255,255,.28);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);padding:12px 14px;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start}
.lock .notif .icon{width:38px;height:38px;border-radius:9px}
.lock .notif .t{flex:1;font-size:14.5px;line-height:1.3}
.lock .notif .t b{font-weight:600;display:flex;justify-content:space-between}
.lock .notif .t b span{font-weight:400;opacity:.65;font-size:13px}
.qbtn{position:absolute;bottom:48px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,background .2s}
.qbtn:active{transform:scale(1.2)}.qbtn.on{background:#fff;color:#000}
.qbtn.on svg{fill:#000}
.qbtn svg{fill:#fff}
.qbtn.fl{left:46px}.qbtn.cam{right:46px}
.hint{position:absolute;bottom:42px;font-size:13px;opacity:.0;transition:opacity .3s}
.screen.locked .hint.show{opacity:.7}

/* app container */
.appwin{position:absolute;left:0;top:0;width:393px;height:852px;z-index:30;overflow:hidden;transform-origin:0 0;border-radius:55px;
  background:var(--app-bg);color:var(--app-fg);display:none}
.appwin.anim{transition:transform .48s cubic-bezier(.25,.9,.25,1),border-radius .48s,opacity .3s}
.appwin .cover{position:absolute;inset:0;z-index:5;transition:opacity .25s .12s;pointer-events:none}
.appwin.open .cover{opacity:0}
.appbody{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.appbody::-webkit-scrollbar{display:none}
.screen.dark .appwin{--app-bg:#000;--app-cell:#1c1c1e;--app-fg:#fff;--app-sub:#8e8e93;--app-sep:rgba(84,84,88,.6)}

/* iOS list styles */
.navtitle{font-size:34px;font-weight:700;letter-spacing:.3px;padding:96px 20px 8px}
.sbar{margin:0 16px 18px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--app-sub);font-size:17px}
.group{margin:0 16px 30px;background:var(--app-cell);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:44px;font-size:17px;position:relative;cursor:pointer}
.row:active{background:rgba(120,120,128,.16)}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:59px;height:.5px;background:var(--app-sep)}
.row .ri{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.row .ri svg{width:19px;height:19px;fill:#fff}
.row .rt{flex:1}
.row .rv{color:var(--app-sub);font-size:17px}
.row .chev{width:8px;height:14px;fill:none;stroke:#c4c4c7;stroke-width:2}
.profile{min-height:78px}
.profile .av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#a2a8b8,#6c7387);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#fff;flex:none}
.profile .rt b{display:block;font-size:20px;font-weight:500}
.profile .rt span{font-size:13px;color:var(--app-fg)}
.profile+.row::before{left:16px!important}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.16);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s}
.sw.on{background:var(--ios-green)}.sw.on::after{transform:translateX(20px)}

/* calculator */
.calc{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 17px 46px}
.calc .disp{text-align:right;font-family:var(--font-num);font-weight:300;font-size:88px;line-height:1;padding:0 8px 14px;white-space:nowrap;letter-spacing:-2px;font-variant-numeric:tabular-nums;overflow:hidden}
.calc .keys{display:grid;grid-template-columns:repeat(4,80px);gap:13px;justify-content:space-between}
.calc button{height:80px;border-radius:40px;border:0;font:400 34px var(--font-num);color:#fff;background:#333;cursor:pointer;transition:background .25s}
.calc button:active{background:#737373;transition:none}
.calc .fn{background:#a5a5a5;color:#000;font-size:30px;font-weight:500}.calc .fn:active{background:#d9d9d9}
.calc .op{background:#ff9f0a;font-size:40px}.calc .op:active{background:#fcc78d}
.calc .op.sel{background:#fff;color:#ff9f0a}
.calc .zero{grid-column:span 2;text-align:left;padding-left:31px}

/* clock */
.clock{position:absolute;inset:0;background:#000;color:#fff}
.clock .edit{position:absolute;top:58px;left:20px;right:20px;display:flex;justify-content:space-between;color:#ff9f0a;font-size:17px}
.clock .navtitle{color:#fff}
.wc{display:flex;justify-content:space-between;align-items:center;margin:0 20px;padding:14px 0;border-bottom:.5px solid rgba(84,84,88,.6)}
.wc .c small{display:block;color:#8e8e93;font-size:14px}
.wc .c b{font-size:24px;font-weight:400}
.wc .t{font-family:var(--font-num);font-size:52px;font-weight:200;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;display:flex;justify-content:space-around;padding-top:7px;box-sizing:border-box;background:rgba(22,22,22,.9);border-top:.5px solid rgba(84,84,88,.6);font-size:10px;color:#8e8e93}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar div.on{color:#ff9f0a}
.tabbar svg{width:26px;height:26px;fill:currentColor}

/* notes */
.note-row{padding:11px 16px;position:relative}
.note-row+.note-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--app-sep)}
.note-row b{display:block;font-size:17px;font-weight:600}
.note-row span{font-size:15px;color:var(--app-sub)}
.notes-foot{position:sticky;bottom:0;height:83px;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 20px;box-sizing:border-box;font-size:12px;color:var(--app-fg);background:var(--app-bg)}

/* placeholder app */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--app-sub);font-size:15px}
.ph .icon{width:96px;height:96px;border-radius:22px}
.ph b{color:var(--app-fg);font-size:22px;font-weight:600}

/* control center */
.cc{z-index:55;background:rgba(0,0,0,.25);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);opacity:0;pointer-events:none;transition:opacity .3s}
.cc.open{opacity:1;pointer-events:auto}
.cc .inner{position:absolute;left:0;right:0;top:0;padding:110px 30px 0;display:grid;grid-template-columns:repeat(4,70px);grid-auto-rows:70px;gap:16px;justify-content:space-between;
  transform:scale(.9) translateY(-30px);transform-origin:top right;transition:transform .4s cubic-bezier(.2,.9,.3,1.1)}
.cc.open .inner{transform:none}
.tile{border-radius:22px;background:rgba(120,120,128,.38);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.tile.big{grid-column:span 2;grid-row:span 2;display:grid;grid-template-columns:1fr 1fr;padding:14px;gap:10px;cursor:default;border-radius:26px}
.cbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:auto;transition:background .2s}
.cbtn svg,.tile svg{fill:#fff;width:26px;height:26px}
.cbtn.on.blue{background:var(--ios-blue)}.cbtn.on.orange{background:var(--ios-orange)}.cbtn.on.green{background:var(--ios-green)}
.tile.on{background:#fff}.tile.on svg{fill:#000}
.tile.music{grid-column:span 2;grid-row:span 2;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:16px;cursor:default;font-size:14px;border-radius:26px}
.tile.music .ctr{display:flex;gap:24px;align-self:center;align-items:center}
.tile.music .ctr svg{cursor:pointer}
.slider{grid-row:span 2;border-radius:26px;background:rgba(120,120,128,.38);position:relative;overflow:hidden;cursor:ns-resize;touch-action:none}
.slider .fill{position:absolute;left:0;right:0;bottom:0;background:#fff}
.slider svg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:28px;height:28px;fill:#8a8a8e;z-index:1}

/* home indicator & off */
.hbar{position:absolute;left:50%;width:200px;margin-left:-100px;bottom:0;height:22px;z-index:90;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;box-sizing:border-box;cursor:grab;touch-action:none}
.hbar i{width:139px;height:5px;border-radius:3px;background:#fff;transition:background .25s}
.screen.dark-status .hbar i{background:#000}
.off{position:absolute;inset:0;background:#000;z-index:200;opacity:0;pointer-events:none;transition:opacity .35s}
.screen.sleeping .off{opacity:1;pointer-events:auto;cursor:pointer}
.hud{position:absolute;left:12px;top:180px;width:10px;height:150px;border-radius:6px;background:rgba(255,255,255,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:95;overflow:hidden;opacity:0;transition:opacity .3s,width .2s}
.hud.show{opacity:1;width:44px;border-radius:14px}
.hud i{position:absolute;left:0;right:0;bottom:0;background:#fff;transition:height .15s}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:rgba(40,40,40,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;z-index:96;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* wallpapers: lock screen / home screen */
.wall.wl{background:url(assets/wall_lock.jpg) center/cover #000}
.wall.wh{background:url(assets/wall_home.jpg) center/cover #000}
.wall.wl,.wall.wh{transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1),filter .45s}
.screen.locked .wall.wh{opacity:0}
.screen:not(.locked) .wall.wl{opacity:0}
.screen.locked .wall{filter:none}

/* 手机上全屏显示 */
body.mobile{padding:0!important;background:#000}
body.mobile .stage{gap:0;justify-content:center;align-items:center}
body.mobile .caption,body.mobile .hw{display:none}
body.mobile .phone{width:393px;height:852px;padding:0;border-radius:0;background:#000;box-shadow:none}
body.mobile .screen{border-radius:0}
body.mobile .appwin{border-radius:0!important}
body.mobile{margin:0;height:100dvh}body.mobile .stage{height:100dvh}

/* 手机模式：高度跟随玩家屏幕；底部横条往上挪，避开真手机的上滑手势区，并可直接点按 */
body.mobile .phone,body.mobile .screen,body.mobile .appwin{height:var(--sh,852px)}
body.mobile .hbar{bottom:14px;height:26px;width:180px;margin-left:-90px;padding-bottom:9px}
/* 全屏 App：小手机的横条放到系统横条上方，避免两条重叠 */
body.standalone .hbar{bottom:30px}

/* 屏幕较矮时（浏览器里打开）压缩主屏幕和正在播放的间距 */
body.short .page{padding-top:56px}
body.short .grid{grid-auto-rows:80px;row-gap:6px}
body.short .widget .wbox{height:146px}
body.short .widget{gap:4px}
body.short .search{bottom:112px}
body.short .np-grab{margin:44px 0 12px}
body.short .np-art{width:min(333px,calc(var(--sh) - 390px));height:min(333px,calc(var(--sh) - 390px))}
body.short .np-meta{margin-top:18px}
body.short .np-bar{margin-top:12px}
body.short .np-ctl{margin-top:8px}
body.short .np-vol{margin-top:14px}
body.short .np-bot{margin-top:12px}
/* 手机上用真手机自己的状态栏和灵动岛，不再画假的（否则会出现两条状态栏） */
body.mobile .status,body.mobile .island{display:none}

/* =========================================================
   APP STYLES — iOS 字号体系（pt = px，393 宽母版）
   Large Title 34 · Title2 22 · Title3 20 · Headline/Body 17 · Callout 16
   Subhead 15 · Footnote 13 · Caption1 12 · Caption2 11
   ========================================================= */
:root{
  --fs-lt:34px; --fs-t2:22px; --fs-t3:20px; --fs-body:17px; --fs-call:16px; --fs-sub:15px; --fs-foot:13px; --fs-cap:12px; --fs-cap2:11px;
}
/* ---------- system pieces ---------- */
.lock .notifs{margin-top:auto;margin-bottom:116px;display:flex;flex-direction:column;gap:8px;width:361px}
.lock .notifs .notif{margin:0;width:auto;cursor:pointer}
.lock .notif .t{font-size:var(--fs-sub);line-height:20px}
.lock .notif .t b{font-size:var(--fs-sub)}
.lock .notif .t b span{font-size:var(--fs-foot)}
.lock .nc-h{display:none}
.screen.nc .lock{background:rgba(0,0,0,.28);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);z-index:56}
.screen.nc .lock .qbtn{display:none}
.appbody{overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--app-bg);color:var(--app-fg);transition:transform .4s cubic-bezier(.3,.9,.3,1),filter .4s;will-change:transform;font-size:var(--fs-body)}
.view.enter{transform:translateX(100%)}
.view.under{transform:translateX(-28%);filter:brightness(.92)}
.vs{flex:1;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;scrollbar-width:none;min-height:0;position:relative}
.vs::-webkit-scrollbar{display:none}
.nb{flex:none;height:44px;padding-top:54px;display:grid;grid-template-columns:110px 1fr 110px;align-items:center;background:color-mix(in srgb,var(--app-bg) 86%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;z-index:3;border-bottom:.5px solid var(--app-sep)}
.nb.plain{border-bottom:0;background:var(--app-bg);backdrop-filter:none}
.nb.plain.dark{background:#000}
.nb.clear{background:transparent;border:0;backdrop-filter:none}
.nbl{display:flex;align-items:center;gap:5px;padding-left:9px;font-size:var(--fs-body);cursor:pointer;white-space:nowrap;overflow:hidden;min-height:44px}
.nbt{text-align:center;font-size:var(--fs-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.nbt small{display:block;font-size:var(--fs-cap);font-weight:400;opacity:.65}
.nbr{display:flex;justify-content:flex-end;align-items:center;padding-right:16px;font-size:var(--fs-body);cursor:pointer;color:var(--ios-blue)}
.navtitle{font-size:var(--fs-lt);font-weight:700;letter-spacing:.2px;padding:4px 20px 8px;line-height:41px}
.view>.vs>.navtitle:first-child{padding-top:58px}
.navsub{padding:0 20px 8px;color:var(--app-sub);font-size:var(--fs-foot)}
.sbar{margin:0 16px 16px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--app-sub);font-size:var(--fs-body)}
.ghdr{padding:0 36px 7px;font-size:var(--fs-foot);color:var(--app-sub);text-transform:uppercase}
.bsec{padding:6px 20px 8px;font-size:var(--fs-t3);font-weight:700;line-height:25px}
.bsec.sm{font-size:var(--fs-sub);font-weight:600;padding-top:12px}
.group{margin:0 16px 24px}
.group.flush{margin-left:0;margin-right:0;border-radius:0}
.row{font-size:var(--fs-body);gap:12px}
.row .rt{line-height:22px;min-width:0}
.row .rt b{font-weight:400;display:block}
.row .rt small{display:block;font-size:var(--fs-foot);color:var(--app-sub);line-height:18px}
.row .rv{font-size:var(--fs-body);display:flex;align-items:center;gap:6px;white-space:nowrap}
.row .rv.sm{font-size:var(--fs-sub)}
.row.tall{padding-top:8px;padding-bottom:8px}
.ri.plain{background:none;width:29px}
.ri.plain svg{fill:currentColor;width:24px;height:22px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}.dot.lg{width:14px;height:14px}
.pill{background:rgba(120,120,128,.16);color:var(--ios-blue);border-radius:16px;padding:6px 14px;font-size:var(--fs-sub);font-weight:600;cursor:pointer;white-space:nowrap;font-style:normal;display:inline-flex;align-items:center}
.pill.sm{padding:5px 12px;font-size:var(--fs-sub);background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(10px)}
.pill.round{padding:5px 7px}.pill.round svg{width:18px;height:18px}
.seg{margin:0 16px 14px;display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;font-size:var(--fs-foot);font-weight:600}
.seg span{flex:1;text-align:center;padding:6px 0;border-radius:7px;cursor:pointer}
.seg .on{background:var(--app-cell);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.tb-bar{flex:none;height:83px;padding:12px 22px 0;box-sizing:border-box;display:flex;justify-content:space-between;align-items:flex-start;font-size:var(--fs-body);background:color-mix(in srgb,var(--app-bg) 92%,transparent);border-top:.5px solid var(--app-sep)}
.tb-bar small{font-size:var(--fs-cap2);color:var(--app-fg);padding-top:4px}
.tb-bar.red{color:#ff3b30}
.view .tabbar{position:static;flex:none;display:flex;justify-content:space-around;height:83px;padding-top:7px;box-sizing:border-box;font-size:10px;text-align:center;line-height:1.2}
.view .tabbar div{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px}
.view .tabbar b{font-size:22px;font-weight:400;line-height:26px}
.tabbar.light{background:color-mix(in srgb,var(--app-bg) 92%,transparent);color:#999;border-top:.5px solid var(--app-sep);font-size:10px}
.tabbar.light div{justify-content:flex-start;padding-top:22px;font-size:10px}
.tabbar.light.ph-tb div,.tabbar.dark div{padding-top:0}
.tabbar.light div.on{color:var(--ios-blue)}
.tabbar.dark{background:rgba(22,22,22,.94);border-top:.5px solid rgba(84,84,88,.6);color:#8e8e93}
.tabbar.dark div.on{color:#ff9f0a}
.faceid{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center}
.fid-box{width:160px;height:160px;border-radius:30px;background:rgba(40,40,40,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:var(--fs-sub)}
.faceid.ok svg{color:#34c759}
.ph-note{padding:10px 24px 16px;color:var(--app-sub);font-size:var(--fs-foot);text-align:center;line-height:18px}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--app-sub);font-size:var(--fs-sub)}
.ph b{font-size:var(--fs-t2)}

/* ---------- home widgets (iOS 尺寸，克制字号) ---------- */
.wbox{height:164px;padding:14px 16px}
.w-weather .city{font-size:var(--fs-sub);font-weight:600;line-height:18px}
.w-weather .deg{font-size:42px;font-weight:300;line-height:46px;letter-spacing:-.5px;margin-top:0}
.w-weather .sub{left:16px;bottom:14px;font-size:var(--fs-cap);font-weight:600;line-height:15px}
.w-weather .sub span{font-weight:500;opacity:1}
.w-weather .sub svg{width:16px;height:16px;margin-bottom:2px}
.w-cal .wd{font-size:var(--fs-cap2);font-weight:600;letter-spacing:.02em;line-height:13px}
.w-cal .dn{font-size:30px;font-weight:400;line-height:34px;letter-spacing:0;margin:0}
.w-cal .ev{margin-top:6px;font-size:var(--fs-cap);line-height:15px;padding-left:6px;border-left-width:3px}
.w-cal .ev b{font-weight:600}.w-cal .ev span{font-size:var(--fs-cap2)}
.w-cal .ev+.ev{margin-top:5px}
.w-cal .ev.red{border-color:#ff2d55}

/* ---------- home: context menu & Spotlight ---------- */
.ctx{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ctx-icon{position:absolute}
.ctx-menu{position:absolute;width:250px;border-radius:14px;overflow:hidden;background:rgba(242,242,247,.86);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#000;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.ctx-menu div{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:var(--fs-body);border-bottom:.5px solid rgba(60,60,67,.2);cursor:pointer}
.ctx-menu div:last-child{border:0}
.ctx-menu div.red{color:#ff3b30}
.ctx-menu div.sep{border-bottom:7px solid rgba(60,60,67,.12)}
.spot{position:absolute;inset:0;z-index:58;background:rgba(30,30,40,.45);backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);display:flex;flex-direction:column;padding:0 16px;box-sizing:border-box}
.spot-res{flex:1;overflow-y:auto;padding-top:62px;touch-action:pan-y;scrollbar-width:none}
.spot-res .sh{font-size:var(--fs-foot);font-weight:600;color:rgba(255,255,255,.65);padding:14px 4px 6px}
.spot-res .si{display:flex;flex-direction:column;padding:10px 14px;background:rgba(255,255,255,.14);border-radius:12px;margin-bottom:6px;cursor:pointer}
.spot-res .si b{font-size:var(--fs-body);font-weight:500}.spot-res .si small{font-size:var(--fs-foot);color:rgba(255,255,255,.7)}
.spot-res .sug{color:rgba(255,255,255,.75);font-size:var(--fs-sub);padding:8px 4px;line-height:22px}
.spot-bar{display:flex;gap:10px;align-items:center;padding:10px 0 46px}
.spot-bar label{flex:1;display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;background:rgba(255,255,255,.2);padding:0 14px;color:rgba(255,255,255,.7)}
.spot-bar input{flex:1;background:none;border:0;outline:0;color:#fff;font:400 var(--fs-body) var(--font)}
.spot-bar input::placeholder{color:rgba(255,255,255,.6)}
.spot-bar span{color:#fff;font-size:var(--fs-body);cursor:pointer}

/* ---------- KakaoTalk ---------- */
.kakao{color:#191919}
.k-top{flex:none;padding:58px 16px 6px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.k-top b{font-size:var(--fs-t2);font-weight:700}
.k-top span{display:flex;gap:18px}
.k-chips{flex:none;display:flex;gap:6px;padding:6px 16px 8px;background:#fff}
.k-chips span{font-size:var(--fs-foot);padding:5px 12px;border-radius:15px;border:1px solid #e3e3e3;color:#555;cursor:pointer}
.k-chips span.on{background:#191919;border-color:#191919;color:#fff}
.k-row{display:flex;gap:12px;padding:8px 16px;align-items:center;cursor:pointer;min-height:48px}
.k-row:active{background:#f2f2f2}
.k-av{width:46px;height:46px;border-radius:17px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--fs-body);font-weight:600;overflow:hidden}
.k-av.sm{width:38px;height:38px;border-radius:14px;font-size:var(--fs-sub)}
.k-av.lg{width:58px;height:58px;border-radius:21px;font-size:var(--fs-t3)}
.k-av.xl{width:96px;height:96px;border-radius:36px;font-size:36px}
.k-av.ghost{visibility:hidden}
.k-mid{flex:1;min-width:0}
.k-mid b{font-size:var(--fs-call);font-weight:600;display:flex;align-items:center;gap:4px;line-height:21px}
.k-mid b span{color:#999;font-weight:400;font-size:var(--fs-sub)}
.k-mid b em{color:#b0b0b0;display:flex}
.k-mid p{margin:2px 0 0;font-size:var(--fs-foot);color:#808080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.k-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start;padding-top:3px}
.k-r small{font-size:var(--fs-cap2);color:#a0a0a0;white-space:nowrap}
.k-r i{font-style:normal;background:#ff4b2b;color:#fff;font-size:var(--fs-cap2);font-weight:600;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-sizing:border-box}
.k-r i.muted{background:#c8c8c8}
.k-sec{font-size:var(--fs-cap);color:#909090;padding:14px 16px 4px;border-top:.5px solid #eee}
.k-row.me-prof{padding-top:6px;padding-bottom:12px}
.k-gift{font-size:var(--fs-cap);border:1px solid #ddd;border-radius:14px;padding:4px 10px;color:#555}
.k-tab{flex:none;height:83px;display:flex;justify-content:space-around;padding-top:8px;box-sizing:border-box;border-top:.5px solid #e8e8e8;background:#fff}
.k-tab div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#b4b4b4;cursor:pointer;min-width:56px}
.k-tab svg{width:25px;height:25px;fill:currentColor}
.k-tab .on{color:#191919}
.k-cnt{color:#555;font-weight:400;font-size:var(--fs-sub)}
.k-hd{display:flex;gap:16px;color:#1f1f1f}
.k-find{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:.5px solid #ddd;font-size:var(--fs-sub);color:#333}
.k-find input{flex:1;height:32px;border-radius:8px;border:0;background:#f1f1f1;padding:0 10px;font:400 var(--fs-sub) var(--font);color:#111;outline:0}
.k-find span{cursor:pointer;padding:0 2px}.k-fc{font-size:var(--fs-cap);color:#888}
.k-list{padding:6px 0 16px}
.k-date{margin:14px auto 8px;width:max-content;padding:3px 12px;border-radius:12px;background:rgba(0,0,0,.12);color:#fff;font-size:var(--fs-cap)}
.k-m{display:flex;padding:0 10px;margin-top:4px;align-items:flex-end;gap:5px}
.k-m.first{margin-top:10px}
.k-m.me{justify-content:flex-end}
.k-m.them{align-items:flex-start;gap:8px}
.k-col{display:flex;flex-direction:column;gap:4px;max-width:262px}
.k-who{font-size:var(--fs-cap);color:#46525e;line-height:15px}
.k-line{display:flex;align-items:flex-end;gap:5px}
.k-m time{font-size:10px;color:#56636f;white-space:nowrap;flex:none;line-height:12px}
.k-b{background:#fff;padding:7px 11px;border-radius:15px;font-size:var(--fs-sub);line-height:20px;max-width:236px;word-break:break-word;color:#191919}
.k-m.me .k-b{background:#fee500}
.k-m.them.first .k-b{border-top-left-radius:4px}
.k-m.me.first .k-b{border-top-right-radius:4px}
.k-m.hit .k-b{box-shadow:0 0 0 2px rgba(255,140,0,.45)}
.k-m.hit-on .k-b{box-shadow:0 0 0 2px #ff8c00;background:#fff3c4}
.k-call{display:flex;align-items:center;gap:9px}
.k-call .ci{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.07);display:flex;align-items:center;justify-content:center;font-style:normal;color:#3a3a3c}
.k-call .ci.miss{color:#e5484d}
.k-call span{display:flex;flex-direction:column;font-size:var(--fs-sub);line-height:19px}.k-call small{font-size:var(--fs-cap);color:#666}
.k-voice{display:flex;align-items:center;gap:8px;cursor:pointer}
.k-voice .pl{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:#333}
.k-voice .wv{display:flex;gap:2px;align-items:center;height:20px}
.k-voice .wv i{width:2px;background:#555;border-radius:1px;height:6px}
.k-voice .wv i:nth-child(3n){height:14px}.k-voice .wv i:nth-child(4n+1){height:18px}.k-voice .wv i:nth-child(5n+2){height:10px}
.k-voice small{font-size:var(--fs-cap);color:#666}
.k-file{display:flex;gap:10px;align-items:center;min-width:180px}
.k-file span{font-size:var(--fs-sub);display:flex;flex-direction:column;line-height:19px}.k-file small{font-size:var(--fs-cap2);color:#888}
.k-photo{width:180px;height:135px;border-radius:12px;cursor:pointer}
.k-in{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 34px;background:#fff}
.k-plus{font-size:26px;color:#888;line-height:1;width:24px;text-align:center}
.k-field{flex:1;min-height:36px;border-radius:18px;background:#f3f3f3;display:flex;align-items:center;padding:0 14px;font-size:var(--fs-sub);color:#191919}
.k-send{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#888;font-weight:700;cursor:pointer}
.kakao .nb{border-bottom:0}
.kprof .vs{display:flex;align-items:flex-end;justify-content:center}
.kp-top{flex:none;display:flex;justify-content:space-between;padding:60px 18px 0;color:#fff;font-size:var(--fs-t3);cursor:pointer}
.kp-main{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;padding-bottom:28px;border-bottom:.5px solid rgba(255,255,255,.3);width:100%}
.kp-main b{font-size:var(--fs-t3);font-weight:600}.kp-main p{margin:0;font-size:var(--fs-foot);opacity:.85;min-height:16px}
.kp-btns{flex:none;display:flex;justify-content:center;gap:44px;padding:20px 0 50px;color:#fff}
.kp-btns span{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.kp-btns em{font-style:normal;font-size:var(--fs-cap)}

/* ---------- Instagram ---------- */
.ig{color:#000;font-size:var(--fs-sub)}
.ig-top{flex:none;padding:54px 16px 4px;display:flex;justify-content:space-between;align-items:center;background:#fff;min-height:44px}
.ig-top>span{display:flex;gap:20px;align-items:center}
.ig-handle{font-size:var(--fs-t3);display:flex;align-items:center;gap:6px}
.ig-logo{font-family:"Grand Hotel","Snell Roundhand","Brush Script MT",cursive;font-size:30px;line-height:1}
.ig-dmb{position:relative}.ig-dmb i{position:absolute;right:-7px;top:-6px;background:#ff3040;color:#fff;font-style:normal;font-size:var(--fs-cap2);font-weight:600;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ig-stories{display:flex;gap:14px;padding:8px 12px 12px;overflow:hidden;border-bottom:.5px solid #dbdbdb}
.ig-st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:var(--fs-cap);width:68px;cursor:pointer}
.ig-st span{width:68px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{width:66px;height:66px;border-radius:50%;padding:2.5px;box-sizing:border-box;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
.ring.mine{background:#dbdbdb}
.ring div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:var(--fs-t3)}
.ig-post{padding-bottom:8px}
.ig-ph{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:var(--fs-foot)}
.ig-ph b{font-weight:600}.ig-ph small{display:block;font-size:var(--fs-cap2);color:#555}
.ig-ph>span{margin-left:auto}

/* ---------- X ---------- */

.x-tabs{flex:none;display:flex;border-bottom:.5px solid #2f3336}
.x-tabs b{flex:1;text-align:center;padding:12px 0 13px;font-size:var(--fs-sub);color:#71767b;font-weight:600;cursor:pointer}

.x-post{display:flex;gap:10px;padding:12px 16px;border-bottom:.5px solid #2f3336;cursor:pointer}

.x-h{font-size:var(--fs-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}.x-h b{font-weight:700}.x-h span{color:#71767b}
.x-t{font-size:var(--fs-sub);line-height:20px;margin-top:2px}
.x-t.big{font-size:var(--fs-body);line-height:24px;margin:12px 0}
.x-rto{font-size:var(--fs-sub);color:#71767b}
.x-img{height:190px;border-radius:16px;margin-top:10px;border:.5px solid #2f3336}

.x-bm-on{color:#1d9bf0}

.x-h2{display:flex;gap:10px;align-items:center}.x-h2 b{font-size:var(--fs-sub);display:block}.x-h2 small{color:#71767b;font-size:var(--fs-sub)}

.x-stat{display:flex;flex-wrap:wrap;gap:16px;padding-top:12px;color:#71767b;font-size:var(--fs-sub)}.x-stat b{color:#e7e9ea}
.x-bmk{color:#1d9bf0;display:flex;gap:4px;align-items:center;width:100%;font-size:var(--fs-foot)}
.xapp .nb{border-bottom:.5px solid #2f3336}

/* ---------- Photos ---------- */
.photos .ph-hdr{position:absolute;left:0;right:0;top:0;padding:54px 16px 18px;display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(rgba(0,0,0,.45),transparent);color:#fff;z-index:4;pointer-events:none}
.photos .ph-hdr b{font-size:var(--fs-lt);font-weight:700;display:block;line-height:40px}
.photos .ph-hdr small{font-size:var(--fs-foot);opacity:.9}
.photos .ph-hdr span{display:flex;gap:8px;pointer-events:auto}
.ph-lib{padding-top:2px}
.ph-g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:2px}
.ph-t{aspect-ratio:1;position:relative;cursor:pointer;max-width:100%}
.ph-t i{position:absolute;font-style:normal;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.5);font-size:var(--fs-cap2)}
.ph-t .hrt{left:5px;bottom:3px;font-size:var(--fs-foot)}.ph-t .vid{right:5px;bottom:3px}.ph-t .left{right:5px;bottom:3px}
.ph-count{text-align:center;padding:16px 0 24px;font-size:var(--fs-foot);font-weight:600;line-height:18px}
.ph-count small{font-weight:400;color:var(--app-sub)}
.ph-mem{margin:0 16px 22px;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;height:200px}
.ph-mem div{position:absolute;inset:0}
.ph-mem b{position:absolute;left:16px;bottom:30px;color:#fff;font-size:var(--fs-t2);font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ph-mem small{position:absolute;left:16px;bottom:12px;color:#fff;font-size:var(--fs-foot);opacity:.9}
.al-row{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;padding:0 16px 22px;scrollbar-width:none;touch-action:pan-x pan-y}
.al-row>div{cursor:pointer}
.al-c{width:150px;height:150px;border-radius:10px}
.al-row b{display:block;font-size:var(--fs-sub);font-weight:400;margin-top:6px;line-height:19px}.al-row small{color:var(--app-sub);font-size:var(--fs-sub)}
.mem-hero{height:320px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;box-sizing:border-box;color:#fff}
.mem-hero b{font-size:var(--fs-lt);font-weight:700}.mem-hero small{font-size:var(--fs-sub)}
.pd-img{width:393px;height:393px;margin-top:60px;position:relative}
.pd-img .live{position:absolute;left:10px;top:10px;font-style:normal;font-size:var(--fs-cap);background:rgba(0,0,0,.35);color:#fff;padding:3px 9px;border-radius:12px}
.pd-cap{padding:18px 16px;color:#fff;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pd-cap>b{font-size:var(--fs-body);font-weight:600;line-height:23px}
.pd-cap em{font-style:normal;font-size:var(--fs-foot);color:#ff9f0a}
.exif{width:100%;background:#1c1c1e;border-radius:12px;overflow:hidden}
.exif div{padding:9px 14px;font-size:var(--fs-foot);color:#d1d1d6;border-bottom:.5px solid rgba(84,84,88,.5)}.exif div:last-child{border:0}
.pd-bar{flex:none;height:76px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;color:#0a84ff;font-size:24px;background:#000}

/* ---------- Camera ---------- */
.cam .vs{display:flex;flex-direction:column;background:#000}
.cam-top{display:flex;justify-content:space-between;padding:58px 24px 10px;color:#fff;font-size:var(--fs-t3)}
.cam-vf{height:520px;position:relative;transition:filter .1s}.cam-vf.flash{filter:brightness(3)}
.cam-grid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.25) 33% calc(33% + 1px),transparent 0 66%,rgba(255,255,255,.25) 66% calc(66% + 1px),transparent 0),linear-gradient(transparent 33%,rgba(255,255,255,.25) 33% calc(33% + 1px),transparent 0 66%,rgba(255,255,255,.25) 66% calc(66% + 1px),transparent 0)}
.cam-zoom{display:flex;justify-content:center;gap:10px;margin-top:-50px;position:relative}
.cam-zoom span{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:var(--fs-cap);display:flex;align-items:center;justify-content:center}.cam-zoom .on{color:#ffd60a;font-weight:600}
.cam-modes{display:flex;justify-content:center;gap:18px;padding:30px 0 14px;font-size:var(--fs-foot);color:#fff;font-weight:500;white-space:nowrap}.cam-modes .on{color:#ffd60a}
.cam-bot{display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0}
.cam-thumb{width:46px;height:46px;border-radius:8px;cursor:pointer}
.cam-shut{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #000,0 0 0 7px #fff;cursor:pointer}
.cam-shut:active{transform:scale(.92)}
.cam-flip{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs-t3)}

/* ---------- Notes ---------- */
.notes .group{margin-bottom:22px}
.note-row{padding:10px 16px;position:relative;cursor:pointer}
.note-row+.note-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--app-sep)}
.note-row b{display:flex;align-items:center;gap:4px;font-size:var(--fs-body);font-weight:600;line-height:22px}
.note-row span{display:block;font-size:var(--fs-sub);color:var(--app-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}
.note-row em{font-style:normal;color:var(--app-fg);margin-right:8px}
.note-d{text-align:center;color:var(--app-sub);font-size:var(--fs-foot);padding:12px 0 4px}
.note-t{font-size:28px;font-weight:700;padding:8px 20px 4px;line-height:34px}
.note-b{white-space:pre-wrap;padding:8px 20px 60px;font-size:var(--fs-body);line-height:26px}

/* ---------- Calendar ---------- */
.cal-wd{flex:none;display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:var(--fs-cap2);color:var(--app-sub);padding:2px 0 6px;border-bottom:.5px solid var(--app-sep);background:var(--app-bg)}
.cal-month{padding-bottom:8px}
.cal-mt{font-size:var(--fs-t3);font-weight:600;padding:14px 0 8px 14px;color:var(--app-fg)}
.cal-mt.cur{color:#ff3b30}.cal-mt small{display:block;font-size:var(--fs-foot);color:var(--app-sub);font-weight:400}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-g span{height:52px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fs-t3);cursor:pointer;border-top:.5px solid var(--app-sep);padding-top:5px;box-sizing:border-box}
.cal-g span:empty{border-top-color:transparent;cursor:default}
.cal-g em{font-style:normal;width:30px;height:30px;line-height:30px;border-radius:50%}
.cal-g .today em{background:#ff3b30;color:#fff;font-weight:600}
.cal-g i{width:5px;height:5px;border-radius:50%;margin-top:-1px}.cal-g i.x{opacity:.35}
.cal-g i+i{display:none}
.cal-wk{flex:none;display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:4px 6px 6px;background:color-mix(in srgb,var(--app-bg) 92%,transparent)}
.cal-wk small{display:block;font-size:var(--fs-cap2);color:var(--app-sub)}
.cal-wk b{display:inline-block;width:32px;height:32px;line-height:32px;border-radius:50%;font-size:var(--fs-t3);font-weight:400}
.cal-wk .sel b{background:var(--app-fg);color:var(--app-bg);font-weight:600}.cal-wk .today b{color:#ff3b30}.cal-wk .today.sel b{background:#ff3b30;color:#fff}
.cal-dh{flex:none;text-align:center;font-size:var(--fs-sub);padding:2px 0 8px;border-bottom:.5px solid var(--app-sep)}
.cal-ad{display:flex;flex-direction:column;gap:3px;padding:6px 8px 6px 60px;border-bottom:.5px solid var(--app-sep)}
.cal-tl{position:relative;padding-left:56px}
.cal-hr{height:50px;border-top:.5px solid var(--app-sep);position:relative}
.cal-hr small{position:absolute;left:-52px;top:-8px;font-size:var(--fs-cap2);color:var(--app-sub);width:46px;text-align:right}
.cal-blk{background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);color:color-mix(in srgb,var(--c) 70%,var(--app-fg));border-radius:5px;padding:3px 7px;font-size:var(--fs-foot);font-weight:600;cursor:pointer;line-height:17px}
.cal-blk small{display:block;font-weight:400;font-size:var(--fs-cap2)}
.cal-blk.tl{position:absolute;left:60px;right:8px;height:44px;box-sizing:border-box}
.cal-blk.x{text-decoration:line-through;opacity:.55}
.cal-row{display:flex;gap:10px;padding:10px 16px;align-items:center;cursor:pointer}
.cal-row i{width:4px;align-self:stretch;border-radius:2px;flex:none}
.cal-row div{flex:1}.cal-row b{font-size:var(--fs-body);font-weight:400;display:block;line-height:22px}.cal-row small{font-size:var(--fs-foot);color:var(--app-sub)}
.cal-row.x b{text-decoration:line-through;color:var(--app-sub)}
.cal-row+.cal-row{border-top:.5px solid var(--app-sep)}
.ev-h{padding:20px 20px 22px;display:flex;flex-direction:column;gap:4px}
.ev-h b{font-size:var(--fs-t2);font-weight:600;line-height:28px}.ev-h b.x{text-decoration:line-through;color:var(--app-sub)}
.ev-h span{font-size:var(--fs-sub);color:var(--app-sub)}.ev-h em{font-style:normal;color:#ff3b30;font-size:var(--fs-sub);margin-top:4px}

/* ---------- Reminders ---------- */
.rem .sbar{margin-top:8px}
.rem-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 22px}
.rem-g div{background:var(--app-cell);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px;cursor:pointer}
.rem-g i{width:30px;height:30px;border-radius:50%;color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sub)}
.rem-g b{font-size:26px;font-weight:700;text-align:right;line-height:30px}.rem-g span{grid-column:span 2;color:var(--app-sub);font-weight:600;font-size:var(--fs-sub)}
.rem-i{display:flex;gap:12px;padding:10px 20px;align-items:flex-start;border-bottom:.5px solid var(--app-sep);margin-left:0}
.rem-i i{width:22px;height:22px;border-radius:50%;border:1.6px solid;box-sizing:border-box;flex:none;margin-top:1px}
.rem-i b{font-weight:400;font-size:var(--fs-body);display:block;line-height:22px}.rem-i small{color:var(--app-sub);font-size:var(--fs-sub)}
.rem-i.done b{color:var(--app-sub)}
.rem-more{padding:14px 20px;font-size:var(--fs-sub);color:var(--app-sub)}

/* ---------- Clock ---------- */
.clock{color:#fff}
.clock .navtitle{color:#fff}
.view.clock>.vs>.navtitle:first-child{padding-top:4px}
.wc{display:flex;justify-content:space-between;align-items:center;margin:0 20px;padding:12px 0;border-bottom:.5px solid rgba(84,84,88,.6)}
.wc .c small{display:block;color:#8e8e93;font-size:var(--fs-foot)}
.wc .c b{font-size:var(--fs-t2);font-weight:400}
.wc .t{font-family:var(--font-num);font-size:52px;font-weight:200;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.al-sec{padding:16px 20px 6px;font-size:var(--fs-body);font-weight:600}
.al-none{display:flex;justify-content:space-between;margin:0 20px;padding:10px 0;color:#8e8e93;font-size:var(--fs-body);border-bottom:.5px solid rgba(84,84,88,.6)}.al-none span{color:#ff9f0a;background:#2c2c2e;border-radius:14px;padding:3px 12px;font-size:var(--fs-sub)}
.al-row{display:flex;justify-content:space-between;align-items:center;margin:0 20px;padding:8px 0;border-bottom:.5px solid rgba(84,84,88,.6)}

/* ---------- time ---------- */
const WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function tick(){
  const d = new Date(), h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  $('#sbTime').textContent = state.locked ? '中国移动' : `${h}:${m}`;
  $('#lkTime').textContent = `${h}:${m}`;
  $('#lkDate').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${WD[d.getDay()]}`;
  $('#wCalWd').textContent = WD[d.getDay()]; $('#wCalDn').textContent = d.getDate();
  document.querySelectorAll('.cwd').forEach(t => t.textContent = WD[d.getDay()]);
  document.querySelectorAll('.cdn').forEach(t => t.textContent = d.getDate());
  const s = d.getSeconds(), mm = d.getMinutes() + s/60, hh = (h%12) + mm/60;
  document.querySelectorAll('.hh').forEach(l => l.setAttribute('transform',`rotate(${hh*30} 30 30)`));
  document.querySelectorAll('.mh').forEach(l => l.setAttribute('transform',`rotate(${mm*6} 30 30)`));
  document.querySelectorAll('.sh').forEach(l => l.setAttribute('transform',`rotate(${s*6} 30 30)`));
  document.querySelectorAll('[data-tz]').forEach(el => {
    try { el.textContent = new Intl.DateTimeFormat('zh-CN',{timeZone:el.dataset.tz,hour:'numeric',minute:'2-digit',hour12:false}).format(d); } catch(e){}
  });
}
tick(); setInterval(tick, 1000);

/* ---------- helpers ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1600); }
function islandFlash(cls, l, r, ms=1800){
  const il = $('#island'); $('#ilL').innerHTML = l; $('#ilR').innerHTML = r;
  il.className = 'island ' + cls; clearTimeout(il._t); il._t = setTimeout(()=> il.className = 'island', ms);
}
function localPt(e){ const r = screen.getBoundingClientRect(), s = r.width / W; return { x:(e.clientX - r.left)/s, y:(e.clientY - r.top)/s, s }; }
function syncStatus(){
  $('#sbPlane').style.display = state.airplane ? '' : 'none';
  $('#sbSignal').style.display = state.airplane ? 'none' : '';
  $('#sbWifi').style.display = state.wifi ? '' : 'none';
  document.querySelectorAll('#cc [data-t]').forEach(b => {
    const k = b.dataset.t; if (k in state) b.classList.toggle('on', !!state[k]);
  });
  const tv = state.app && topView(), tone = tv ? tv.dataset.tone : 'dark';
  const darkStatus = state.app && !state.cc && (tone === 'light' || (tone === 'auto' && !state.dark));
  screen.classList.toggle('dark-status', !!darkStatus);
  screen.classList.toggle('dark', state.dark);
}

/* ---------- lock / unlock ---------- */
function unlock(){
  if (!state.locked) return;
  const wasNC = state.nc; state.nc = false;
  state.locked = false; screen.classList.remove('locked', 'nc'); tick();
  if (wasNC) return;
  islandFlash('pill','<svg width="18" height="18" viewBox="0 0 16 22" fill="#fff"><path d="M8 1a5 5 0 0 0-5 5v1h2V6a3 3 0 0 1 6 0v3H2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5z"/></svg>','',900);
}
function openNC(){ if (state.locked) return; state.nc = true; state.locked = true; screen.classList.add('locked', 'nc'); tick(); }
function lock(){
  state.nc = false; screen.classList.remove('nc');
  closeCC(); if (state.app) closeApp(true);
  state.locked = true; screen.classList.add('locked'); exitJiggle(); tick();
}
function sleep(){ lock(); screen.classList.add('sleeping'); }
function wake(){ screen.classList.remove('sleeping'); const h=$('#hint'); h.classList.add('show'); setTimeout(()=>h.classList.remove('show'),2500); }

/* ---------- open / close app ---------- */
let openFrom = null;
function openApp(id, fromEl){
  if (state.jiggle || state.app) return;
  closeCC();
  const r = screen.getBoundingClientRect(), s = r.width / W;
  const ir = fromEl ? fromEl.getBoundingClientRect() : { left:r.left+W*s/2-31*s, top:r.top+H*s/2-31*s, width:62*s, height:62*s };
  openFrom = { x:(ir.left-r.left)/s, y:(ir.top-r.top)/s, w:ir.width/s, h:ir.height/s };
  state.app = id;
  buildApp(id);
  const cover = $('#appcover'); cover.style.background = ART[id] ? ART[id].bg : '#000'; cover.innerHTML = '';
  appwin.className = 'appwin'; appwin.style.display = 'block';
  appwin.style.transform = `translate(${openFrom.x}px,${openFrom.y}px) scale(${openFrom.w/W},${openFrom.h/H})`;
  appwin.style.borderRadius = '120px 120px 120px 120px / 55px 55px 55px 55px';
  appwin.offsetWidth;
  appwin.className = 'appwin anim open';
  appwin.style.transform = 'none'; appwin.style.borderRadius = '55px';
  screen.classList.add('in-app');
  syncStatus();
}
function closeApp(instant){
  if (!state.app) return;
  const f = openFrom || { x:W/2-31, y:H/2-31, w:62, h:62 };
  const done = () => { appwin.style.display = 'none'; appbody.innerHTML = ''; };
  state.app = null; screen.classList.remove('in-app'); syncStatus();
  if (instant){ done(); return; }
  appwin.className = 'appwin anim';
  appwin.style.transform = `translate(${f.x}px,${f.y}px) scale(${f.w/W},${f.h/H})`;
  appwin.style.borderRadius = '120px 120px 120px 120px / 55px 55px 55px 55px';
  setTimeout(() => { if (!state.app) done(); }, 480);
}

/* ---------- Spotlight index (隐藏相簿与锁定备忘录不会被搜到) ---------- */
function spotlight(q){
  q = q.trim(); if (!q) return [];
  const out = [];
  Object.entries(NAMES).forEach(([id, n]) => { if (n.toLowerCase().includes(q.toLowerCase())) out.push(['应用', n, '', () => openDeep(id)]); });
  Object.entries(CONTACTS).forEach(([id, c]) => { if (c.n.includes(q)) out.push(['联系人', c.n, c.ph, () => openDeep('phone', 'contact', id)]); });
  CHATS.forEach(c => { if (c.name.includes(q)) out.push(['KakaoTalk', c.name, plain(c.last.text, c.last.me), () => openDeep('kakao', 'kchat', c.id)]); });
  NOTES.forEach((n, i) => { if (!n.lock && (n.t.includes(q) || n.b.includes(q))) out.push(['备忘录', n.t, shortD(n.d), () => openDeep('notes', 'note', i)]); });
  FILES.forEach((f, i) => { if (f[0].toLowerCase().includes(q.toLowerCase())) out.push(['文件', f[0], `${f[5]} · ${shortD(f[1])}`, () => openDeep('files', 'file', i)]); });
  PHOTOS.forEach(p => { if (p.key && visible(p) && p.c.includes(q)) out.push(['照片', p.c, ymd(p.d), () => openDeep('photos', 'photo', p.id)]); });

/* ---------- calculator ---------- */
function mountCalc(){
  let cur = '0', prev = null, op = null, fresh = false;
  const disp = $('#cDisp'), ac = $('#cAC');
  const fmt = n => {
    if (!isFinite(n)) return '错误';
    if (Math.abs(n) >= 1e9 || (Math.abs(n) < 1e-8 && n !== 0)) return n.toExponential(4).replace('+','');
    return String(parseFloat(n.toPrecision(9)));
  };
  const show = () => {
    let t = cur;
    if (/^-?\d+(\.\d*)?$/.test(t)){ const [a,b] = t.split('.'); t = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b !== undefined ? '.' + b : ''); }
    disp.textContent = t;
    const len = t.length; disp.style.fontSize = (len <= 6 ? 88 : len <= 8 ? 72 : len <= 10 ? 60 : 50) + 'px';
    ac.textContent = (cur !== '0' && !fresh) ? 'C' : 'AC';
    appbody.querySelectorAll('.op').forEach(b => b.classList.toggle('sel', fresh && b.dataset.k === op));
  };
  const calc = (a, b, o) => o === '+' ? a+b : o === '-' ? a-b : o === '*' ? a*b : a/b;
  appbody.querySelector('.keys').addEventListener('click', e => {
    const k = e.target.dataset && e.target.dataset.k; if (!k) return;
    if (/\d/.test(k)){
      if (fresh || cur === '错误'){ cur = '0'; fresh = false; }
      if (cur.replace(/[-.]/g,'').length >= 9) return;
      cur = cur === '0' ? k : cur === '-0' ? '-' + k : cur + k;
    } else if (k === '.'){
      if (fresh){ cur = '0'; fresh = false; }
      if (!cur.includes('.')) cur += '.';
    } else if (k === 'ac'){
      if (ac.textContent === 'C'){ cur = '0'; } else { cur = '0'; prev = null; op = null; fresh = false; }
    } else if (k === 'neg'){
      cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; if (fresh) fresh = false;
    } else if (k === 'pct'){
      cur = fmt(parseFloat(cur) / 100);
    } else if (k === '='){
      if (op !== null && prev !== null){ cur = fmt(calc(prev, parseFloat(cur), op)); prev = null; op = null; fresh = true; }
    } else {
      if (op !== null && prev !== null && !fresh){ cur = fmt(calc(prev, parseFloat(cur), op)); }
      prev = parseFloat(cur); op = k; fresh = true;
    }
    show();
  });
  show();
}

const QUICK = { kakao:[['新聊天','✎'],['搜索聊天','⌕']], camera:[['自拍','◎'],['录制视频','●']], notes:[['新建备忘录','✎'],['新清单','☑']], photos:[['最近项目','▦'],['个人收藏','♡']], instagram:[['相机','◎'],['消息','➤']], maps:[['回家','⌂'],['标记我的位置','⌖']] };
function showCtx(el){
  const id = el.dataset.app, sr = screen.getBoundingClientRect(), s = sr.width / W, ic = (el.querySelector('.icon') || el).getBoundingClientRect();
  const x = (ic.left - sr.left) / s, y = (ic.top - sr.top) / s, w = ic.width / s, h = ic.height / s;
  const items = [...(QUICK[id] || []).map(([t, i]) => `<div data-q="${t}">${t}<span>${i}</span></div>`), `<div data-q="edit" class="sep">编辑主屏幕<span>▦</span></div>`, `<div data-q="share">共享 App<span>⇪</span></div>`, `<div data-q="rm" class="red">移除 App<span>⊖</span></div>`];
  const below = y + h + 14 + items.length * 45 < H - 40;
  const c = document.createElement('div'); c.className = 'ctx';
  c.innerHTML = `<div class="ctx-icon" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${(el.querySelector('.icon') || el).outerHTML}</div><div class="ctx-menu" style="left:${Math.min(Math.max(12, x), W - 262)}px;${below ? `top:${y + h + 12}px` : `bottom:${H - y + 12}px`}">${items.join('')}</div>`;
  c.querySelector('.ctx-icon > *').style.cssText = 'width:100%;height:100%;border-radius:' + (el.classList.contains('wbox') ? '22px' : '14.5px');
  screen.append(c);

    const q = e.target.closest('[data-q]'); c.remove(); if (!q) return;
    const k = q.dataset.q;
    if (k === 'edit') { state.jiggle = true; home.classList.add('jiggle'); }
    else if (k === 'rm') toast('原型中不能移除 App');
    else if (k === 'share') toast('共享暂未制作');
    else if (k === '个人收藏') openDeep('photos', 'album', '个人收藏');
    else if (k === '最近项目') openDeep('photos', 'album', '最近项目');
    else if (k === '搜索聊天') openDeep('kakao');
    else if (k === '消息') openDeep('instagram', 'igdm');

}

/* ---------- Spotlight ---------- */
function openSpot(){
  const sp = document.createElement('div'); sp.className = 'spot';
  sp.innerHTML = `<div class="spot-res"><div class="sh">Siri 建议</div><div class="sug">可以搜索联系人、聊天、备忘录、文件、照片和日程。<br>试试：书妍、蛋糕、portfolio、Demo</div></div><div class="spot-bar"><label>${'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 3a7 7 0 0 1 5.6 11.2l5 5-1.4 1.4-5-5A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>'}<input id="spotQ" type="search" placeholder="搜索" autocomplete="off"></label><span>取消</span></div>`;
  screen.append(sp); const q = sp.querySelector('#spotQ'), res = sp.querySelector('.spot-res'); setTimeout(() => q.focus(), 50);
  let acts = [];
  q.addEventListener('input', () => {
    const r = spotlight(q.value); acts = r.map(x => x[3]);
    if (!q.value.trim()) { res.innerHTML = '<div class="sh">Siri 建议</div><div class="sug">可以搜索联系人、聊天、备忘录、文件、照片和日程。</div>'; return; }
    if (!r.length) { res.innerHTML = '<div class="sug">没有结果</div>'; return; }
    let h = '', last = ''; r.forEach((x, i) => { if (x[0] !== last) { h += `<div class="sh">${x[0]}</div>`; last = x[0]; } h += `<div class="si" data-i="${i}"><b>${x[1]}</b>${x[2] ? `<small>${x[2]}</small>` : ''}</div>`; });
    res.innerHTML = h;
  });
  sp.addEventListener('click', e => {
    if (e.target.closest('.spot-bar span')) { sp.remove(); return; }
    const it = e.target.closest('.si'); if (it) { sp.remove(); acts[+it.dataset.i](); }
  });
}

let hp = null;
home.addEventListener('pointerdown', e => {
  if (state.locked || state.app || state.cc) return;
  const p = localPt(e); if (p.y > H - 36) return;
  const target = e.target.closest('[data-app]');
  hp = { x0:p.x, y0:p.y, dx:0, moved:false, target, t0:Date.now(), id:e.pointerId };
  hp.lp = setTimeout(() => { if (hp && !hp.moved){ if (hp.target && !state.jiggle) showCtx(hp.target); else { state.jiggle = true; home.classList.add('jiggle'); } hp.target = null; hp.long = true; } }, 500);
  $('#pages').style.transition = 'none';
});
window.addEventListener('pointermove', e => {
  if (!hp || e.pointerId !== hp.id) return;
  const p = localPt(e); hp.dx = p.x - hp.x0; const dy = p.y - hp.y0;
  if (!hp.moved && Math.hypot(hp.dx, dy) > 8){ hp.moved = true; clearTimeout(hp.lp); }
  if (hp.moved && Math.abs(hp.dx) > Math.abs(dy)){
    let x = -state.page*W + hp.dx; if (x > 0) x *= .35; if (x < -W) x = -W + (x + W) * .35;
    $('#pages').style.transform = `translateX(${x}px)`; showDots();
  }
});
window.addEventListener('pointerup', e => {
  if (!hp || e.pointerId !== hp.id) return;
  clearTimeout(hp.lp); $('#pages').style.transition = '';
  const h = hp; hp = null;
  if (h.moved){
    if (h.dx < -60) setPage(state.page+1); else if (h.dx > 60) setPage(state.page-1); else setPage(state.page);
  } else if (!h.long && h.target && !state.jiggle){
    openApp(h.target.dataset.app, h.target.querySelector('.icon') || h.target);
  } else if (!h.long && state.jiggle && !h.target){ exitJiggle(); }
});

/* ---------- swipe up (home bar + lock screen) ---------- */
let up = null;
function startUp(e, from){

/* 手机上：在底部区域（系统手势条上方）往上滑也能回主屏幕；轻点不拦截，下面的按钮照常能点 */
let zone = null;
screen.addEventListener('pointerdown', e => {
  if (!document.body.classList.contains('mobile') || up || e.target.closest('#hbar')) return;

}, true);

  if (!zone || e.pointerId !== zone.id || up) return;

}, true);
window.addEventListener('pointerup', e => { if (zone && e.pointerId === zone.id) zone = null; }, true);
$('#hbar').addEventListener('pointerdown', e => { e.stopPropagation(); startUp(e, state.cc ? 'cc' : state.locked ? 'lock' : state.app ? 'app' : 'home'); });
$('#notifs').addEventListener('click', e => { const n = e.target.closest('[data-deep]'); if (!n) return; const [a, r, x] = n.dataset.deep.split('|'); openDeep(a, r, x); });
$('#lock').addEventListener('pointerdown', e => {
  if (!state.locked || e.target.closest('.qbtn') || e.target.closest('.notif')) return;
  const p = localPt(e); if (p.y < 54) return; startUp(e, 'lock');
});
window.addEventListener('pointermove', e => {
  if (!up || e.pointerId !== up.id) return;
  const p = localPt(e); up.dy = Math.min(0, p.y - up.y0);
  if (up.from === 'app'){
    const k = Math.max(.55, 1 + up.dy / 700);
    appwin.style.transform = `translate(${W*(1-k)/2}px,${up.dy*.6 + H*(1-k)/2}px) scale(${k})`;
    appwin.style.borderRadius = '55px';
  } else if (up.from === 'lock'){
    $('#lock').style.transform = `translateY(${up.dy}px)`;
    $('#lock').style.opacity = 1 + up.dy/500;
  }
});
window.addEventListener('pointerup', e => {
  if (!up || e.pointerId !== up.id) return;
  const u = up; up = null; const go = u.dy < -70;
  if (u.from === 'app'){
    if (go || (u.bar && u.dy > -6)) closeApp(); else { appwin.className = 'appwin anim open'; appwin.style.transform = 'none'; }
  } else if (u.from === 'lock'){
    const lk = $('#lock'); lk.style.transition = ''; lk.style.transform = ''; lk.style.opacity = '';
    if (go || (u.bar && u.dy > -6)) unlock();
    else if (u.dy === 0){ const h=$('#hint'); h.classList.add('show'); setTimeout(()=>h.classList.remove('show'),1500); }
  } else if (u.from === 'cc'){ closeCC(); }
  else if (u.from === 'home'){ if (state.jiggle) exitJiggle(); else setPage(0); }
});

/* ---------- control center ---------- */
const cc = $('#cc');
function openCC(){ state.cc = true; cc.classList.add('open'); syncStatus(); }
function closeCC(){ state.cc = false; cc.classList.remove('open'); syncStatus(); }
let topPull = null;
screen.addEventListener('pointerdown', e => {
  const p = localPt(e);
  if (p.y < 54 && !e.target.closest('#island') && !state.cc) topPull = { x:p.x, y0:p.y, id:e.pointerId };
}, true);
window.addEventListener('pointerup', e => {
  if (!topPull || e.pointerId !== topPull.id) return;
  const p = localPt(e), t = topPull; topPull = null;
  if (p.y - t.y0 > 40){ if (t.x > W/2) openCC(); else openNC(); }
});
cc.addEventListener('click', e => {
  if (e.target === cc || e.target.id === 'ccInner'){ closeCC(); return; }
  const o = e.target.closest('[data-open]'); if (o){ closeCC(); if (state.locked) unlock(); setTimeout(()=>openApp(o.dataset.open), 200); return; }
  const t = e.target.closest('[data-t]'); if (!t) return;

  if (k === 'lockrot' || k === 'focus'){ t.classList.toggle('on'); toast(k==='focus' ? (t.classList.contains('on')?'勿扰模式：打开':'勿扰模式：关闭') : (t.classList.contains('on')?'竖排方向锁定：打开':'竖排方向锁定：关闭')); return; }

$('#ccPlay').addEventListener('click', () => toast('音乐 App 尚未制作'));
document.querySelectorAll('.slider').forEach(sl => {
  const fill = sl.querySelector('.fill');
  const set = e => { const r = sl.getBoundingClientRect(); const v = Math.max(0, Math.min(1, 1 - (e.clientY - r.top)/r.height)); fill.style.height = v*100 + '%';
    if (sl.dataset.s === 'bright') screen.style.filter = `brightness(${.45 + v*.55})`; else { state.vol = v; $('#hudFill').style.height = v*100+'%'; } };
  sl.addEventListener('pointerdown', e => { e.stopPropagation(); sl.setPointerCapture(e.pointerId); set(e); sl.onpointermove = set; });
  sl.addEventListener('pointerup', () => sl.onpointermove = null);

/* ---------- hardware buttons ---------- */
let hudT;

  const h = $('#hud'); h.classList.add('show'); clearTimeout(hudT); hudT = setTimeout(()=>h.classList.remove('show'), 1400); }

$('#off').addEventListener('click', wake);

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ const o = document.querySelector('.spot,.ctx'); if (o) { o.remove(); return; } if (state.cc) closeCC(); else if (state.app) closeApp(); else if (state.jiggle) exitJiggle(); else if (state.locked) unlock(); }
  if (e.key === 'l' && !e.target.closest('input,textarea') && !document.querySelector('.spot')) state.locked ? unlock() : lock();

/* ---------- scale to window ---------- */
let actual = false;
function fit(){
  // 手机上打开：去掉机身外框，铺满整个屏幕
  const mobile = Math.min(innerWidth, innerHeight) < 520 || (matchMedia('(pointer: coarse)').matches && innerWidth < 900);
  document.body.classList.toggle('mobile', mobile);
  if (mobile) {
    // 从主屏幕图标打开（全屏网页 App）时，iPhone 报告的高度会少算底部，直接用整块屏幕的尺寸
    const standalone = navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
    document.body.classList.toggle('standalone', !!standalone);
    const vv = window.visualViewport;
    let vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
    if (standalone) { const portrait = innerHeight >= innerWidth; const sw = window.screen.width, sh = window.screen.height; vw = portrait ? Math.min(sw, sh) : Math.max(sw, sh); vh = portrait ? Math.max(sw, sh) : Math.min(sw, sh); vh = Math.max(vh, innerHeight, document.documentElement.clientHeight); }
    if (!(vw > 0 && vh > 0)) { vw = innerWidth; vh = innerHeight; }
    let s = vw / 393; H = Math.round(Math.max(640, Math.min(1000, vh / s)));
    if (vh / s < 640) { s = vh / 640; H = 640; }
    document.documentElement.style.setProperty('--sh', H + 'px');
    document.body.classList.toggle('short', H < 780);
    $('#phone').style.transform = `scale(${s})`;
    const f = $('#fit'); f.style.width = 393*s + 'px'; f.style.height = H*s + 'px';
    document.body.style.overflow = 'hidden'; return;
  }
  H = 852; document.documentElement.style.removeProperty('--sh'); document.body.classList.remove('short');
  const availH = innerHeight - 60, availW = innerWidth - 32;
  const s = actual ? 1 : Math.min(1, availH/880, availW/421);
  $('#phone').style.transform = `scale(${s})`;
  const f = $('#fit'); f.style.width = 421*s + 'px'; f.style.height = 880*s + 'px';
  $('#scaleLbl').textContent = Math.round(s*100) + '%';
  $('#scaleBtn').textContent = actual ? '适应窗口' : '实际尺寸';
  document.body.style.overflow = actual ? 'auto' : 'hidden';
  document.querySelector('.stage').style.justifyContent = actual && innerHeight < 940 ? 'flex-start' : 'center';
}
$('#scaleBtn').addEventListener('click', () => { actual = !actual; fit(); });
addEventListener('resize', fit); window.visualViewport && visualViewport.addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 300)); addEventListener('load', fit); fit(); setTimeout(fit, 300);
syncStatus();
window.__proto = { openDeep, pushView, popView, closeApp, unlock, lock, R };
})();
