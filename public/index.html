    const r = spotlight(q.value); acts = r.map(x => x[3]);
    if (!q.value.trim()) { res.innerHTML = '<div class="sh">Siri 建议</div><div class="sug">可以搜索联系人、聊天、备忘录、文件、照片和日程。</div>'; return; }
    if (!r.length) { res.innerHTML = '<div class="sug">没有结果</div>'; return; }
    let h = '', last = ''; r.forEach((x, i) => { if (x[0] !== last) { h += `<div class="sh">${x[0]}</div>`; last = x[0]; } h += `<div class="si" data-i="${i}"><b>${x[1]}</b>${x[2] ? `<small>${x[2]}</small>` : ''}</div>`; });
    res.innerHTML = h;
  });
  sp.addEventListener('click', e => {
    if (e.target.closest('.spot-bar span')) { sp.remove(); return; }
    const it = e.target.closest('.si'); if (it) { sp.remove(); acts[+it.dataset.i](); }
  });
}

let hp = null;
home.addEventListener('pointerdown', e => {
  if (state.locked || state.app || state.cc) return;
  const p = localPt(e); if (p.y > H - 36) return;
  const target = e.target.closest('[data-app]');
  hp = { x0:p.x, y0:p.y, dx:0, moved:false, target, t0:Date.now(), id:e.pointerId };
  hp.lp = setTimeout(() => { if (hp && !hp.moved){ if (hp.target && !state.jiggle) showCtx(hp.target); else { state.jiggle = true; home.classList.add('jiggle'); } hp.target = null; hp.long = true; } }, 500);
  $('#pages').style.transition = 'none';
});
window.addEventListener('pointermove', e => {
  if (!hp || e.pointerId !== hp.id) return;
  const p = localPt(e); hp.dx = p.x - hp.x0; const dy = p.y - hp.y0;
  if (!hp.moved && Math.hypot(hp.dx, dy) > 8){ hp.moved = true; clearTimeout(hp.lp); }
  if (hp.moved && Math.abs(hp.dx) > Math.abs(dy)){
    let x = -state.page*W + hp.dx; if (x > 0) x *= .35; if (x < -W) x = -W + (x + W) * .35;
    $('#pages').style.transform = `translateX(${x}px)`; showDots();
  }
});
window.addEventListener('pointerup', e => {
  if (!hp || e.pointerId !== hp.id) return;
  clearTimeout(hp.lp); $('#pages').style.transition = '';
  const h = hp; hp = null;
  if (h.moved){
    if (h.dx < -60) setPage(state.page+1); else if (h.dx > 60) setPage(state.page-1); else setPage(state.page);
  } else if (!h.long && h.target && !state.jiggle){
    openApp(h.target.dataset.app, h.target.querySelector('.icon') || h.target);
  } else if (!h.long && state.jiggle && !h.target){ exitJiggle(); }
});

/* ---------- swipe up (home bar + lock screen) ---------- */
let up = null;
function startUp(e, from){
  const p = localPt(e);
  up = { y0:p.y, dy:0, from, id:e.pointerId, bar:!!e.target.closest('#hbar') };
  if (from === 'app'){ appwin.className = 'appwin open'; }
  if (from === 'lock'){ $('#lock').style.transition = 'none'; }
}
/* 手机上：在底部区域（系统手势条上方）往上滑也能回主屏幕；轻点不拦截，下面的按钮照常能点 */
let zone = null;
screen.addEventListener('pointerdown', e => {
  if (!document.body.classList.contains('mobile') || up || e.target.closest('#hbar')) return;
  const p = localPt(e); if (p.y < H - 96) return;
  zone = { y0:p.y, id:e.pointerId, e };
}, true);
window.addEventListener('pointermove', e => {
  if (!zone || e.pointerId !== zone.id || up) return;
  const p = localPt(e);
  if (zone.y0 - p.y > 22) { const z = zone; zone = null; startUp(z.e, state.cc ? 'cc' : state.locked ? 'lock' : state.app ? 'app' : 'home'); up.y0 = z.y0; up.bar = false; }
}, true);
window.addEventListener('pointerup', e => { if (zone && e.pointerId === zone.id) zone = null; }, true);
$('#hbar').addEventListener('pointerdown', e => { e.stopPropagation(); startUp(e, state.cc ? 'cc' : state.locked ? 'lock' : state.app ? 'app' : 'home'); });
$('#notifs').addEventListener('click', e => { const n = e.target.closest('[data-deep]'); if (!n) return; const [a, r, x] = n.dataset.deep.split('|'); openDeep(a, r, x); });
$('#lock').addEventListener('pointerdown', e => {
  if (!state.locked || e.target.closest('.qbtn') || e.target.closest('.notif')) return;
  const p = localPt(e); if (p.y < 54) return; startUp(e, 'lock');
});
window.addEventListener('pointermove', e => {
  if (!up || e.pointerId !== up.id) return;
  const p = localPt(e); up.dy = Math.min(0, p.y - up.y0);
  if (up.from === 'app'){
    const k = Math.max(.55, 1 + up.dy / 700);
    appwin.style.transform = `translate(${W*(1-k)/2}px,${up.dy*.6 + H*(1-k)/2}px) scale(${k})`;
    appwin.style.borderRadius = '55px';
  } else if (up.from === 'lock'){
    $('#lock').style.transform = `translateY(${up.dy}px)`;
    $('#lock').style.opacity = 1 + up.dy/500;
  }
});
window.addEventListener('pointerup', e => {
  if (!up || e.pointerId !== up.id) return;
  const u = up; up = null; const go = u.dy < -70;
  if (u.from === 'app'){
    if (go || (u.bar && u.dy > -6)) closeApp(); else { appwin.className = 'appwin anim open'; appwin.style.transform = 'none'; }
  } else if (u.from === 'lock'){
    const lk = $('#lock'); lk.style.transition = ''; lk.style.transform = ''; lk.style.opacity = '';
    if (go || (u.bar && u.dy > -6)) unlock();
    else if (u.dy === 0){ const h=$('#hint'); h.classList.add('show'); setTimeout(()=>h.classList.remove('show'),1500); }
  } else if (u.from === 'cc'){ closeCC(); }
  else if (u.from === 'home'){ if (state.jiggle) exitJiggle(); else setPage(0); }
});

/* ---------- control center ---------- */
const cc = $('#cc');
function openCC(){ state.cc = true; cc.classList.add('open'); syncStatus(); }
function closeCC(){ state.cc = false; cc.classList.remove('open'); syncStatus(); }
let topPull = null;
screen.addEventListener('pointerdown', e => {
  const p = localPt(e);
  if (p.y < 54 && !e.target.closest('#island') && !state.cc) topPull = { x:p.x, y0:p.y, id:e.pointerId };
}, true);
window.addEventListener('pointerup', e => {
  if (!topPull || e.pointerId !== topPull.id) return;
  const p = localPt(e), t = topPull; topPull = null;
  if (p.y - t.y0 > 40){ if (t.x > W/2) openCC(); else openNC(); }
});
cc.addEventListener('click', e => {
  if (e.target === cc || e.target.id === 'ccInner'){ closeCC(); return; }
  const o = e.target.closest('[data-open]'); if (o){ closeCC(); if (state.locked) unlock(); setTimeout(()=>openApp(o.dataset.open), 200); return; }
  const t = e.target.closest('[data-t]'); if (!t) return;
  const k = t.dataset.t;
  if (k === 'flash'){ toggleFlash(); return; }
  if (k === 'lockrot' || k === 'focus'){ t.classList.toggle('on'); toast(k==='focus' ? (t.classList.contains('on')?'勿扰模式：打开':'勿扰模式：关闭') : (t.classList.contains('on')?'竖排方向锁定：打开':'竖排方向锁定：关闭')); return; }
  state[k] = !state[k];
  if (k === 'airplane'){ state.wifi = !state.airplane; state.bt = !state.airplane; state.cell = !state.airplane; }
  syncStatus();
});
$('#ccPlay').addEventListener('click', () => toast('音乐 App 尚未制作'));
document.querySelectorAll('.slider').forEach(sl => {
  const fill = sl.querySelector('.fill');
  const set = e => { const r = sl.getBoundingClientRect(); const v = Math.max(0, Math.min(1, 1 - (e.clientY - r.top)/r.height)); fill.style.height = v*100 + '%';
    if (sl.dataset.s === 'bright') screen.style.filter = `brightness(${.45 + v*.55})`; else { state.vol = v; $('#hudFill').style.height = v*100+'%'; } };
  sl.addEventListener('pointerdown', e => { e.stopPropagation(); sl.setPointerCapture(e.pointerId); set(e); sl.onpointermove = set; });
  sl.addEventListener('pointerup', () => sl.onpointermove = null);
});

/* ---------- lock screen buttons ---------- */
function toggleFlash(){ state.flash = !state.flash; $('#flash').classList.toggle('on', state.flash); document.querySelector('#cc [data-t="flash"]').classList.toggle('on', state.flash); }
$('#flash').addEventListener('click', toggleFlash);
$('#lkCam').addEventListener('click', () => { unlock(); setTimeout(()=>openApp('camera'), 250); });

/* ---------- island ---------- */
$('#island').addEventListener('click', e => {
  e.stopPropagation();
  islandFlash('big', `<div class="icon" style="width:44px;height:44px;border-radius:10px;background:${ART.music.bg}">${ART.music.svg}</div><div>未在播放<br><span style="opacity:.6;font-weight:400">音乐</span></div>`,
    '<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg>', 2600);
});

/* ---------- hardware buttons ---------- */
let hudT;
function vol(d){ state.vol = Math.max(0, Math.min(1, state.vol + d)); $('#hudFill').style.height = state.vol*100 + '%'; $('#slVol .fill').style.height = state.vol*100 + '%';
  const h = $('#hud'); h.classList.add('show'); clearTimeout(hudT); hudT = setTimeout(()=>h.classList.remove('show'), 1400); }
document.querySelectorAll('[data-hw]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.hw;
  if (k === 'power'){ screen.classList.contains('sleeping') ? wake() : sleep(); }
  else if (screen.classList.contains('sleeping')) wake();
  else if (k === 'up') vol(.0625); else if (k === 'down') vol(-.0625);
  else if (k === 'action'){ state.flash ? toggleFlash() : toggleFlash(); islandFlash('pill','<svg width="12" height="18" viewBox="0 0 18 26" fill="#ffd60a"><path d="M3 0h12v4l-3 5v15a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9L3 4z"/></svg>', state.flash?'手电筒 开':'手电筒 关', 1300); }
}));
$('#off').addEventListener('click', wake);

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ const o = document.querySelector('.spot,.ctx'); if (o) { o.remove(); return; } if (state.cc) closeCC(); else if (state.app) closeApp(); else if (state.jiggle) exitJiggle(); else if (state.locked) unlock(); }
  if (e.key === 'l' && !e.target.closest('input,textarea') && !document.querySelector('.spot')) state.locked ? unlock() : lock();
});

/* ---------- scale to window ---------- */
let actual = false;
function fit(){
  // 手机上打开：去掉机身外框，铺满整个屏幕
  const mobile = Math.min(innerWidth, innerHeight) < 520 || (matchMedia('(pointer: coarse)').matches && innerWidth < 900);
  document.body.classList.toggle('mobile', mobile);
  if (mobile) {
    // 从主屏幕图标打开（全屏网页 App）时，iPhone 报告的高度会少算底部，直接用整块屏幕的尺寸
    const standalone = navigator.standalone || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
    document.body.classList.toggle('standalone', !!standalone);
    const vv = window.visualViewport;
    let vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
    if (standalone) { const portrait = innerHeight >= innerWidth; const sw = window.screen.width, sh = window.screen.height; vw = portrait ? Math.min(sw, sh) : Math.max(sw, sh); vh = portrait ? Math.max(sw, sh) : Math.min(sw, sh); vh = Math.max(vh, innerHeight, document.documentElement.clientHeight); }
    if (!(vw > 0 && vh > 0)) { vw = innerWidth; vh = innerHeight; }
    // 按真实屏幕的点数排版（1:1，不放大）：宽度 = 屏幕宽度
    W = Math.round(Math.max(320, Math.min(480, vw))); let s = vw / W; H = Math.round(Math.max(560, Math.min(1000, vh / s)));
    document.documentElement.style.setProperty('--sw', W + 'px'); document.documentElement.style.setProperty('--k', (W / 440).toFixed(4));
    document.documentElement.style.setProperty('--sh', H + 'px');
    document.body.classList.toggle('short', H < 780);
    $('#phone').style.transform = `scale(${s})`;
    const f = $('#fit'); f.style.width = W*s + 'px'; f.style.height = H*s + 'px'; $('#pages').style.transform = `translateX(${-state.page*W}px)`;
    document.body.style.overflow = 'hidden'; return;
  }
  W = 393; H = 852; document.documentElement.style.removeProperty('--sh'); document.documentElement.style.removeProperty('--sw'); document.documentElement.style.setProperty('--k', (393 / 440).toFixed(4)); document.body.classList.remove('short');
  const availH = innerHeight - 60, availW = innerWidth - 32;
  const s = actual ? 1 : Math.min(1, availH/880, availW/421);
  $('#phone').style.transform = `scale(${s})`;
  const f = $('#fit'); f.style.width = 421*s + 'px'; f.style.height = 880*s + 'px';
  $('#scaleLbl').textContent = Math.round(s*100) + '%';
  $('#scaleBtn').textContent = actual ? '适应窗口' : '实际尺寸';
  document.body.style.overflow = actual ? 'auto' : 'hidden';
  document.querySelector('.stage').style.justifyContent = actual && innerHeight < 940 ? 'flex-start' : 'center';
}
$('#scaleBtn').addEventListener('click', () => { actual = !actual; fit(); });
addEventListener('resize', fit); window.visualViewport && visualViewport.addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 300)); addEventListener('load', fit); fit(); setTimeout(fit, 300);
syncStatus();
window.__proto = { openDeep, pushView, popView, closeApp, unlock, lock, R };
})();
